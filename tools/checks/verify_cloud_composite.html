(function(){
  for(let r=0;r<32;r++)for(let g=0;g<32;g++)for(let b=0;b<32;b++){

})();

// ---- geometry ---------------------------------------------------------------
const lonOf=new Float32Array(SIZE), latOf=new Float32Array(SIZE);
for(let i=0;i<SIZE;i++){
  lonOf[i]=(i+0.5)/SIZE*360-180;
  const y=MAXY-(i+0.5)/SIZE*2*MAXY;
  latOf[i]=(2*Math.atan(Math.exp(y/R))-Math.PI/2)*180/Math.PI;
}
// weight = cos(great-circle angle to sub-satellite point)^3, zero below 15°
// elevation. Continuous everywhere, so there is no boundary to feather.
function weights(){
  const W=SATS.map(()=>new Float32Array(SIZE*SIZE));
  const D=Math.PI/180;
  for(let j=0;j<SIZE;j++){
    const la=latOf[j]*D, sla=Math.sin(la), cla=Math.cos(la);
    for(let i=0;i<SIZE;i++){
      const lo=lonOf[i]*D;
      for(let s=0;s<SATS.length;s++){
        const c=cla*Math.cos(lo-SATS[s].lon*D);   // sub-sat lat = 0
        W[s][j*SIZE+i]=c>0.26 ? c*c*c : 0;
      }
    }
  }
  return W;
}

// ---- fetching ---------------------------------------------------------------
function url(sat,iso){
  const bbox=[-MAXY,-MAXY,MAXY,MAXY].join(',');
  if(sat.src==='gibs') return 'https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?SERVICE=WMS&VERSION=1.3.0'+
    '&REQUEST=GetMap&LAYERS='+sat.layer+'&STYLES=&CRS=EPSG:3857&BBOX='+bbox+'&WIDTH='+SIZE+'&HEIGHT='+SIZE+
    '&FORMAT=image/png&TRANSPARENT=TRUE&TIME='+iso;
  return 'https://view.eumetsat.int/geoserver/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS='+
    encodeURIComponent(sat.layer)+'&STYLES=&CRS=EPSG:3857&BBOX='+bbox+'&WIDTH='+SIZE+'&HEIGHT='+SIZE+
    '&FORMAT=image/png&TRANSPARENT=TRUE&TIME='+iso;
}
function stamp(sat,d){
  const p=n=>String(n).padStart(2,'0');
  const s=sat.src==='eum'?'.000Z':'Z';
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+'T'+
         p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':00'+s;
}
function load(u){
  return new Promise((res,rej)=>{
    const im=new Image(); im.crossOrigin='anonymous';
    im.onload=()=>res(im); im.onerror=()=>rej(new Error('img')); im.src=u;
  });
}
const scratch=document.createElement('canvas'); scratch.width=scratch.height=SIZE;
const sctx=scratch.getContext('2d',{willReadFrequently:true});

// Step back through frames until one actually has pixels. §GIBS: the catalogue
// leads publication, and a hole reads as clear sky.
async function grab(sat,log){
  let t=new Date(Date.now()-sat.step*60000);
  t.setUTCSeconds(0,0); t.setUTCMinutes(Math.floor(t.getUTCMinutes()/sat.step)*sat.step);
  for(let k=0;k<10;k++){
    const iso=stamp(sat,t);
    const age=(Date.now()-t.getTime())/60000;
    if(age>MAX_AGE_MIN){ log(sat.name+': no frame within '+MAX_AGE_MIN+' min — dropped'); return null; }
    try{
      const im=await load(url(sat,iso));
      sctx.clearRect(0,0,SIZE,SIZE); sctx.drawImage(im,0,0);
      const d=sctx.getImageData(0,0,SIZE,SIZE).data;
      let n=0; for(let p=3;p<d.length;p+=4*7) if(d[p]>250) n++;
      const cov=n/(d.length/(4*7));
      if(cov>0.02) return {data:d,iso:iso,cov:cov,age:age};
      log(sat.name+' '+iso+': empty, stepping back');
    }catch(e){ log(sat.name+' '+iso+': fetch failed, stepping back'); }
    t=new Date(t.getTime()-sat.step*60000);
  }
  log(sat.name+': no usable frame'); return null;
}

// ---- composite --------------------------------------------------------------
const acc=new Float32Array(SIZE*SIZE), wsum=new Float32Array(SIZE*SIZE);
const out=document.createElement('canvas'); out.width=out.height=SIZE;
const octx=out.getContext('2d');
let composed=false;

const LOW=256, LSH=3;                 // 2048>>3
const lowSum=SATS.map(()=>new Float32Array(LOW*LOW));
const lowN  =SATS.map(()=>new Int32Array(LOW*LOW));

function fold(sat,g,si){
  const d=g.data, W=WGT[si], lut=sat.lut, pal=sat.pal;
  const LS=lowSum[si], LN=lowN[si];
  let n=0,sum=0;
  for(let j=0;j<SIZE;j++){
    const lrow=(j>>LSH)*LOW;
    for(let i=0;i<SIZE;i++){
      const q=j*SIZE+i, p=q<<2;
      const w=W[q]; if(w<=0) continue;
      if(d[p+3]<250) continue;
      let v;
      if(pal){
        const t=CUBE[((d[p]>>3)<<10)|((d[p+1]>>3)<<5)|(d[p+2]>>3)];
        v=(56.9-t)/149*255;
      }else{
        if(Math.abs(d[p]-d[p+2])>6) continue;
        v=d[p];
      }
      const c=lut[v<0?0:v>255?255:v|0];
      acc[q]+=w*c; wsum[q]+=w;
      const l=lrow+(i>>LSH); LS[l]+=c; LN[l]++;
      sum+=c; n++;
    }
  }
  return n?sum/n:NaN;
}

// Honest seam metric: where two satellites both contribute, how far apart are
// their calibrated values? Computed on an 8x-downsampled grid so advection and
// parallax at pixel scale do not dominate.
function overlaps(){
  const out=[];
  for(let a=0;a<SATS.length;a++)for(let b=a+1;b<SATS.length;b++){
    let n=0,s=0;
    for(let l=0;l<LOW*LOW;l++){
      if(lowN[a][l]<8||lowN[b][l]<8) continue;
      s+=Math.abs(lowSum[a][l]/lowN[a][l]-lowSum[b][l]/lowN[b][l]); n++;
    }
    if(n>50) out.push([SATS[a].name+' / '+SATS[b].name, n, s/n]);
  }
  return out;
}
function paint(){
  const lo=+document.getElementById('lo').value, hi=+document.getElementById('hi').value;
  const img=octx.createImageData(SIZE,SIZE), o=img.data;
  for(let q=0,p=0;q<SIZE*SIZE;q++,p+=4){
    if(wsum[q]<=0) continue;
    let f=(acc[q]/wsum[q]-lo)/(hi-lo);
    f=f<0?0:f>1?1:f;
    if(f<0.02) continue;
    const c=ramp(f); o[p]=c[0];o[p+1]=c[1];o[p+2]=c[2];o[p+3]=255*Math.min(1,f*1.6);
  }
  octx.putImageData(img,0,0);
  if(map.getSource('cloudnow')) map.getSource('cloudnow').updateImage({url:out.toDataURL()});
}
// PLACEHOLDER RAMP — replace with Cloud.stops() before this goes anywhere near the app.
function ramp(f){
  const S=[[0,54,110,180],[0.25,60,150,120],[0.5,240,235,200],[0.75,235,150,50],[1,140,20,20]];
  const b=Math.min(0.95,Math.floor(f/0.05)*0.05);
  for(let i=1;i<S.length;i++) if(b<=S[i][0]){
    const a=S[i-1],c=S[i],t=(b-a[0])/(c[0]-a[0]);
    return [a[1]+(c[1]-a[1])*t|0, a[2]+(c[2]-a[2])*t|0, a[3]+(c[3]-a[3])*t|0];
  }
  return [140,20,20];
}

// ---- map --------------------------------------------------------------------
const map=new maplibregl.Map({container:'map',center:[-20,25],zoom:1.6,
  style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},
  layers:[{id:'osm',type:'raster',source:'osm'}]}});

const logEl=document.getElementById('log');
const log=m=>{logEl.textContent+=m+'\n'; logEl.scrollTop=1e9;};
const st=m=>document.getElementById('status').textContent=m;

async function run(){
  acc.fill(0); wsum.fill(0);
  for(let i=0;i<SATS.length;i++){lowSum[i].fill(0);lowN[i].fill(0);}
  document.querySelector('#sats tbody').innerHTML='';
  logEl.textContent='';
  for(let s=0;s<SATS.length;s++){
    const sat=SATS[s];
    st('fetching '+sat.name+' ('+(s+1)+'/'+SATS.length+')');
    const g=await grab(sat,log);
    const tr=document.createElement('tr');
    if(!g){ tr.innerHTML='<td>'+sat.name+'</td><td class="n">—</td><td class="n">—</td><td class="n">—</td>'; }
    else{
      const med=fold(sat,g,s);
      tr.innerHTML='<td>'+sat.name+'</td><td class="n">'+g.iso.slice(11,16)+'Z +'+Math.round(g.age)+
        'm</td><td class="n">'+(g.cov*100).toFixed(0)+'</td><td class="n">'+(isNaN(med)?'—':med.toFixed(1))+'</td>';
    }
    document.querySelector('#sats tbody').appendChild(tr);
  }
  let cov=0; for(let q=0;q<wsum.length;q+=17) if(wsum[q]>0) cov++;
  log('composite coverage '+(cov/(wsum.length/17)*100).toFixed(1)+'% of world raster');
  log('--- overlap disagreement (0-255 scale), the seam number ---');
  for(const [nm,n,d] of overlaps()) log(nm.padEnd(24)+' n='+String(n).padStart(5)+'  mean |delta| = '+d.toFixed(1));
  st('done — read the overlap deltas in the log');
  composed=true; paint();
}

map.on('load',()=>{
  map.addSource('cloudnow',{type:'image',
    coordinates:[[-180,85.0511],[180,85.0511],[180,-85.0511],[-180,-85.0511]],
    url:'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'});
  map.addLayer({id:'cloudnow',type:'raster',source:'cloudnow',paint:{'raster-opacity':0.7,'raster-fade-duration':0}});
  run();
});
for(const id of ['lo','hi','op']){
  const el=document.getElementById(id);
  const upd=()=>{document.getElementById(id+'_v').textContent=el.value;
    if(id==='op'){ if(map.getLayer('cloudnow')) map.setPaintProperty('cloudnow','raster-opacity',el.value/100); }
    else if(composed) paint();};
  el.addEventListener('input',upd); upd();
}
document.getElementById('go').onclick=run;
</script>
