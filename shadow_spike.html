<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow spike — 2026-08-12 eclipse, Spain</title>

<!-- Cesium 1.121 (matches the app's vendored copy). -->
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>

<style>
  html,body,#c{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
  #hud{position:absolute;top:8px;left:8px;z-index:5;font:12px/1.4 monospace;
       color:#fff;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:6px;max-width:72vw}
  #hud b{color:#ffd27a}
  #err{position:absolute;top:8px;left:8px;right:8px;z-index:9;font:13px/1.5 monospace;
       color:#ffb4b4;background:#180a0a;border:1px solid #612;padding:12px;border-radius:8px;display:none;white-space:pre-wrap}
  #btns{position:absolute;top:8px;right:8px;z-index:6;display:flex;gap:6px}
  #btns button{font:12px monospace;color:#fff;background:rgba(0,0,0,.6);border:1px solid #555;
       padding:8px 10px;border-radius:6px;cursor:pointer}
</style>

<div id="c"></div>
<div id="hud">loading…</div>
<div id="btns">
  <button id="bBase">Base: OSM</button>
  <button id="bShadow">Shadows: ON</button>
  <button id="bReset">Reset view</button>
</div>
<div id="err"></div>

<script>
/* ============================================================================
   PASTE YOUR ION TOKEN HERE  (free: https://ion.cesium.com/tokens)
   NOTE: this line resets every time the file is regenerated — re-paste it.
   ========================================================================== */
var ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyNmQyYmQwMC03Nzk3LTQwYjUtODVjNC04Y2U3ZDVjMTNjODAiLCJpZCI6NDU2OTAzLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODQxNTg5ODR9.ax7uLUdH61cKXQuE1GYSRtYnC2pLQI4YIPXpEev-6Xw';

var LAT = 41.9851, LON = -3.4186;
var MAX_UTC = '2026-08-12T18:28:41Z';   // greatest eclipse here: sun alt 7.8°, az 282.9°

var hud = document.getElementById('hud');
var errBox = document.getElementById('err');
function fail(m){ errBox.style.display='block'; errBox.textContent = String(m); hud.style.display='none'; }
function estr(e){ if(!e) return '(no error object)'; return e.message || e.toString() || String(e); }

// Surface the REAL error instead of a swallowed "undefined".
window.addEventListener('error', function(e){ fail('JS error: ' + (e.message || estr(e.error))); });
window.addEventListener('unhandledrejection', function(e){ fail('Promise rejected: ' + estr(e.reason)); });

(function(){
  if (typeof Cesium === 'undefined') { fail('Cesium did not load from the CDN.\nCheck the phone has network and the <script> URL is reachable.'); return; }
  if (ION_TOKEN === 'PASTE_ION_TOKEN_HERE' || !ION_TOKEN) { fail('No ion token set.\nPaste your token into the ION_TOKEN line near the top of this file, then reload.'); return; }
  Cesium.Ion.defaultAccessToken = ION_TOKEN;

  var viewer;
  try {
    // Build the viewer with NO terrain first — it always comes up, even if ion is unreachable.
    viewer = new Cesium.Viewer('c', {
      baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
      navigationHelpButton:false, infoBox:false, selectionIndicator:false,
      timeline:true, animation:true,
    });
  } catch (e) { fail('Viewer construction failed: ' + estr(e) + '\n(WebGL unavailable? try another browser.)'); return; }

  var scene = viewer.scene, globe = scene.globe;

  // Basemap: keep the default ion aerial (layer 0) and add OpenStreetMap on top.
  // OSM starts visible (as requested); B toggles. (OSM tile policy = fine for dev;
  // for production use your own self-hosted tiles.)
  var aerialLayer = viewer.imageryLayers.get(0);
  var osmLayer = new Cesium.ImageryLayer(
    new Cesium.UrlTemplateImageryProvider({
      url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      credit: '© OpenStreetMap contributors', maximumLevel: 19
    })
  );
  viewer.imageryLayers.add(osmLayer);
  var osmOn = true;
  aerialLayer.show = false; osmLayer.show = true;
  function toggleBase(){
    osmOn = !osmOn;
    osmLayer.show = osmOn; aerialLayer.show = !osmOn;
    document.getElementById('bBase').textContent = 'Base: ' + (osmOn ? 'OSM' : 'Aerial');
  }

  // NATIVE shadow map, sun-driven. terrain must CAST (default is receive-only).
  viewer.shadows = true;
  viewer.terrainShadows = Cesium.ShadowMode.ENABLED;
  // Lighting OFF for this diagnostic: terrain stays evenly bright so the only dark
  // thing on screen is an actual shadow. Makes the pole test unambiguous.
  globe.enableLighting = false;
  var sm = scene.shadowMap;
  sm.darkness = 0.3;
  sm.size = 4096;               // crisp — drop to 1024 if mobile struggles
  sm.softShadows = false;
  sm.fadingEnabled = false;     // stop Cesium fading shadows out with camera distance
  sm.maximumDistance = 12000;   // tighter frustum = better depth precision for the pole

  // Camera controller: stop "losing the planet". Collision keeps us above ground;
  // zoom limits keep us in a sane altitude band; press R (or tap Reset) to recover.
  var ctl = scene.screenSpaceCameraController;
  ctl.enableCollisionDetection = true;
  ctl.minimumZoomDistance = 300;
  ctl.maximumZoomDistance = 2000000;   // 2000 km ceiling — can always pull out to see the region

  // Freeze clock at greatest eclipse → sun sits at az 282.9°, alt 7.8°.
  var t = Cesium.JulianDate.fromIso8601(MAX_UTC);
  viewer.clock.currentTime = t.clone();
  viewer.clock.shouldAnimate = false;   // paused; drag timeline to scrub
  viewer.clock.multiplier = 200;
  viewer.timeline.zoomTo(
    Cesium.JulianDate.addMinutes(t, -60, new Cesium.JulianDate()),
    Cesium.JulianDate.addMinutes(t,  60, new Cesium.JulianDate())
  );

  hud.innerHTML = 'viewer up · loading terrain…';

  // Attach World Terrain via its own ready/error events — this is what actually
  // casts the shadows, and the events give us a REAL error if the token is wrong.
  var terrain = Cesium.Terrain.fromWorldTerrain();
  terrain.errorEvent.addEventListener(function(err){
    fail('Terrain failed to load: ' + estr(err) + '\n(Usually a bad/limited ion token, or no network.)');
  });
  terrain.readyEvent.addEventListener(function(provider){
    // provider is guaranteed ready here → .availability exists → safe to sample.
    Cesium.sampleTerrainMostDetailed(provider, [Cesium.Cartographic.fromDegrees(LON, LAT)])
      .then(function(r){ frame((r[0] && Number.isFinite(r[0].height)) ? r[0].height : 900); })
      .catch(function(){ frame(900); });
  });
  scene.setTerrain(terrain);

  var groundH = 900;
  function frame(h){
    groundH = h;

    // GNOMON: a 300 m vertical pole on the terrain. At a 7.8° sun it must throw a
    // shadow ~2 km long. If this shadow renders and MOVES as you scrub the clock,
    // shadows fundamentally work. If it's absent or frozen, the feature is dead.
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(LON, LAT, groundH + 150),
      cylinder: {
        length: 300, topRadius: 15, bottomRadius: 15,
        material: Cesium.Color.RED,
        shadows: Cesium.ShadowMode.ENABLED   // this pole CASTS
      }
    });

    resetView();
    updateSun();
    // Recompute the live sun readout every time the clock changes (i.e. while scrubbing).
    viewer.clock.onTick.addEventListener(updateSun);

    // ADAPTIVE CUTOFF (top-down): scale the shadow distance to camera height so the
    // cutoff always matches the view. Kept ON even when zoomed out, so you can hunt
    // for sunny areas — though wide zooms show only coarse, large-scale shadows
    // (a shadow map can't resolve fine puddles over a wide area; that's the raymarch's job).
    scene.preRender.addEventListener(function(){
      if (!shadowsOn) return;                       // respect the S toggle
      viewer.shadows = true;
      var carto = viewer.camera.positionCartographic;
      var h = carto ? carto.height : 8000;
      sm.maximumDistance = Cesium.Math.clamp(h * 1.4, 3000, 60000);
    });
  }

  // Self-contained solar position (NOAA-style, ~0.2° vs the app) — verified against
  // the app's 7.8°/282.9°. No fragile Cesium astronomy calls, so it can't throw.
  function sunAltAz(ms, latDeg, lonDeg){
    var rad=Math.PI/180, n = ms/86400000 + 2440587.5 - 2451545.0;
    var L = (((280.460 + 0.9856474*n)%360)+360)%360;
    var g = ((((357.528 + 0.9856003*n)%360)+360)%360)*rad;
    var lambda = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g))*rad;
    var eps = (23.439 - 0.0000004*n)*rad;
    var alpha = Math.atan2(Math.cos(eps)*Math.sin(lambda), Math.cos(lambda));
    var delta = Math.asin(Math.sin(eps)*Math.sin(lambda));
    var gmst = ((((280.46061837 + 360.98564736629*n)%360))+360)%360;
    var ha = (gmst + lonDeg)*rad - alpha, lat = latDeg*rad;
    var alt = Math.asin(Math.sin(lat)*Math.sin(delta)+Math.cos(lat)*Math.cos(delta)*Math.cos(ha));
    var az  = Math.atan2(-Math.sin(ha), Math.tan(delta)*Math.cos(lat)-Math.sin(lat)*Math.cos(ha));
    return { alt: alt/rad, az: ((az/rad)+360)%360 };
  }

  function updateSun(){
    var ms = Cesium.JulianDate.toDate(viewer.clock.currentTime).getTime();
    var s = sunAltAz(ms, LAT, LON);
    var lit = s.alt > 0 ? 'sun UP' : 'sun DOWN';
    var carto = viewer.camera.positionCartographic;
    var camH = carto ? carto.height : 0;
    var eye = camH - groundH;                 // roughly eye-to-ground when top-down
    hud.innerHTML =
      '<b>2026-08-12 · Spain · gnomon (top-down)</b><br>' +
      'sun alt <b>' + s.alt.toFixed(1) + '°</b> az <b>' + s.az.toFixed(1) + '°</b> · ' + lit + '<br>' +
      'CAM altitude <b>' + (camH/1000).toFixed(1) + ' km</b> · eye→ground <b>' + (eye/1000).toFixed(1) + ' km</b><br>' +
      'note the km where shadows vanish · scrub · R · S · B';
  }

  // TOP-DOWN view, matching your app (camera directly overhead). At a 7.8° sun the
  // pole's ~2 km shadow lies flat, pointing ESE — clearly visible from straight up.
  function resetView(){
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(LON, LAT, groundH + 8000),
      orientation: {
        heading: 0,
        pitch:   Cesium.Math.toRadians(-90),   // straight down
        roll: 0
      }
    });
  }

  var shadowsOn = true;
  function toggleShadows(){
    shadowsOn = !shadowsOn;
    viewer.shadows = shadowsOn;                 // A/B: is the native shadow map even usable at 7.8°?
    scene.requestRender();
    document.getElementById('bShadow').textContent = shadowsOn ? 'Shadows: ON' : 'Shadows: OFF';
  }

  document.getElementById('bReset').onclick = resetView;
  document.getElementById('bShadow').onclick = toggleShadows;
  document.getElementById('bBase').onclick = toggleBase;
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    if (k === 'r') resetView();
    if (k === 's') toggleShadows();
    if (k === 'b') toggleBase();
  });
})();
</script>
