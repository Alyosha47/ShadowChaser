<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>v33 — ShadowChaser terrain shadows</title>
<link href="vendor/maplibre-gl-5.5.0.css" rel="stylesheet">
<script src="vendor/maplibre-gl-csp-5.5.0.js"></script>
<script>
  if (window.maplibregl && maplibregl.setWorkerUrl)
    maplibregl.setWorkerUrl('vendor/maplibre-gl-csp-worker-5.5.0.js');
</script>
<style>
  html,body{margin:0;height:100%}
  #map{position:absolute;inset:0}
  /* Hidden by default, but kept: there is no console on a phone. Reveals itself on any
     error, and the status line toggles it. */
  #log{display:none;position:absolute;top:0;left:0;right:0;z-index:9;font:13px/1.4 monospace;
       white-space:pre-wrap;padding:8px 10px;color:#8f8;background:rgba(0,0,0,.75)}
  #log.on{display:block}
  #tl{cursor:pointer}
  #log b{color:#ffd27a}
  #ui{position:absolute;bottom:0;left:0;right:0;z-index:9;padding:10px;
      background:rgba(0,0,0,.72);color:#eee;font:13px monospace}
  #t{width:100%}
</style>
<div id="map"></div>
<div id="log">v33 (self-test placed in the viewport) — starting…
</div>
<div id="ui">
  <input id="t" type="range" min="-720" max="720" value="0" step="2">
  <div id="tl">…</div>
  <div id="probe" style="color:#ffd27a">click the map to probe elevation</div>
  <label><input id="dem" type="checkbox"> show elevation</label>
  <label><input id="test" type="checkbox"> self-test (cylinder vs analytic)</label>
  <label><input id="cmp" type="checkbox"> compare scan vs march</label>
  <label><input id="bench" type="checkbox"> benchmark (repaint continuously)</label>
  <span id="fps"></span>
</div>
<script>
var log=document.getElementById('log');
function L(m){
  log.textContent += m+"\n";
  if(m.indexOf('✗')>=0) log.classList.add('on');   /* surface failures without being asked */
}
window.onerror=function(m,s,ln){ L('✗ '+m+' @'+ln); };

/* ── v10: terrain shadows WITHOUT raymarching ─────────────────────────────
   Every ray in the scene shares one azimuth. Writing g = h − s·tan(alt), where
   s is distance along the sun direction, pixel i is shadowed iff some j upstream
   has  h_j > h_i + (s_j − s_i)·tan(alt),  which rearranges to simply  g_j > g_i.

   So the whole problem is "is there a larger g ahead of me along this line?" —
   a running maximum. A running max over a texture is a doubling scan: shift by
   1 texel and take the max, then 2, then 4 … ten passes cover 1024 texels.
   The shadow test then costs ONE lookup, with no loop, no step size, and no
   sampling artefacts at any sun angle.

   The shift direction must be a WHOLE number of texels or each pixel snaps its own way
   and the maximum propagates along slightly different staircases — coarse blocks. So the
   field is built ROTATED, with the sun along +x. Every shift is then exactly (2^k, 0):
   identical for every pixel, and blocks cannot form.

   PASS 1  DEM tiles -> atlas
   PASS 2  atlas -> G, resampled into sun-aligned axes
   PASS 3  doubling scan along +x only, ping-pong
   PASS 4  shade: rotate the pixel, one lookup                                */

var TERRARIUM='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/';
var DEM_Z_MAX=13;
var TILE_PX=256;                      /* terrarium tile size */
var MARGIN_FRAC=0.12;                 /* atlas overhang beyond the viewport, each side */
var DEM_RATIO=1.0;                    /* DEM sample size / atlas texel; 1 = matched */
/* Atlas resolution is what sets shadow detail: texel = span / ATLAS. Sizing it to the
   canvas makes the texel track screen pixels, the way a per-pixel marcher gets for free.
   Capped, because the cost is 4x per doubling and iOS has OOM'd this app before. */
var ATLAS_MIN=1024;
var ATLAS_MAX=window.matchMedia('(min-width: 900px)').matches ? 2048 : 1024;
/* Matching DEM resolution to a 2048 atlas needs ~8x8 tiles; the budget is the dial that
   trades detail against fetches. DEM zoom drops a level whenever the budget is exceeded. */
var TILE_BUDGET=window.matchMedia('(min-width: 900px)').matches ? 160 : 30;
var TILE_CACHE_MAX=150;               /* LRU cap on retained tile textures */
/* SCAN_LEVELS = log2(ATLAS): reach is always the full atlas width. */
var TEST_R_FRAC=1/64;                 /* cylinder radius as a fraction of the atlas, so it
                                         stays visible however the atlas is sized */
var TEST_H=500.0;
/* Four cylinders, OFF-CENTRE. A single one at the centre of rotation is symmetric, so a
   rotation mismatch between the scan and the shade pass turns its shadow but leaves it
   attached — indistinguishable from a correct shadow. Off-centre casters get DISPLACED
   instead, which is unmistakable. */
/* Offsets are a fraction of the VIEWPORT, converted to atlas fraction at use. The atlas is
   sized by shadow reach and is typically several times the viewport, so placing the test
   pattern by atlas fraction puts it tens of km off-screen. */
var TEST_OFF=[[-0.25,-0.25],[0.25,-0.25],[-0.25,0.25],[0.25,0.25]];
var MAX_TERRAIN_H=9000;               /* only a ceiling now; the real max is measured */
var H_STEP=250;                       /* quantise the measured max, or the atlas size would
                                         chase its own contents frame to frame */               /* only used to size the fixed-point range */
var LAT0=41.9851, LON0=-3.4186;
var BASE=Date.parse('2026-08-12T18:28:41Z');   /* eclipse max over Spain */
var offsetMin=0;

function mx(lon){ return (lon+180)/360; }
/* Mercator is undefined past ~85.05 deg, and getBounds happily reports 90 when zoomed out.
   Unclamped, the projection explodes and every quantity derived from it goes with it. */
var MERC_MAX=85.05112878;
/* The whole model assumes ONE sun vector across the view. Shadow length is h/tan(alt), so
   an altitude error d gives a length error d/(sin a . cos a) — which blows up at low sun.
   Cap that relative error and the maximum usable view size follows from the sun angle
   itself, rather than from an arbitrary zoom threshold. */
var SUN_LEN_TOL=0.25;
function latFromMercY(y){ return Math.atan(Math.sinh(Math.PI*(1-2*y)))/RAD; }
function my(lat){
  var r=Math.max(-MERC_MAX,Math.min(MERC_MAX,lat))*RAD;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2;
}

/* verified solar position (matches the app to ~0.2°) */
var RAD=Math.PI/180;
function sunAltAz(ms,lat,lon){
  var n=ms/86400000+2440587.5-2451545.0;
  var Lo=(((280.460+0.9856474*n)%360)+360)%360, g=((((357.528+0.9856003*n)%360)+360)%360)*RAD;
  var lam=(Lo+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*n)*RAD;
  var al=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), de=Math.asin(Math.sin(eps)*Math.sin(lam));
  var gmst=((((280.46061837+360.98564736629*n)%360))+360)%360, ha=(gmst+lon)*RAD-al, la=lat*RAD;
  var alt=Math.asin(Math.sin(la)*Math.sin(de)+Math.cos(la)*Math.cos(de)*Math.cos(ha));
  var az=Math.atan2(-Math.sin(ha),Math.tan(de)*Math.cos(la)-Math.sin(la)*Math.cos(ha));
  return { alt:alt/RAD, az:((az/RAD)+360)%360 };
}

var map=new maplibregl.Map({
  container:'map',
  style:{version:8,
    sources:{ osm:{ type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                    tileSize:256, attribution:'© OpenStreetMap' } },
    layers:[{id:'osm',type:'raster',source:'osm'}]},
  center:[LON0,LAT0], zoom:10
});
L('A. map created');

function compile(gl,type,src,tag){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) L('✗ '+tag+': '+gl.getShaderInfoLog(s));
  return s;
}
function link(gl,vs,fs,tag){
  var p=gl.createProgram(); gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) L('✗ link '+tag+': '+gl.getProgramInfoLog(p));
  return p;
}
function rgbaTarget(gl,size){
  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,size,size,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  /* NEAREST throughout: every one of these textures holds ENCODED numbers, and
     linear filtering would blend the encoding, not the value. */
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  var ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex:tex,fbo:fbo,ok:ok};
}

/* g is packed into 24 bits of RGB. Keeps the no-float-extension, mobile-safe
   property that the DEM encoding already gave us. */
var GLSL_PACK=
  'vec4 packG(float v){'+
  '  v=clamp(v,0.0,0.999999);'+
  '  vec3 e=fract(vec3(1.0,255.0,65025.0)*v);'+
  '  e-=e.yzz*vec3(1.0/255.0,1.0/255.0,0.0);'+
  '  return vec4(e,1.0); }'+
  'float unpackG(vec4 c){ return dot(c.rgb,vec3(1.0,1.0/255.0,1.0/65025.0)); }';

var GLSL_DEM=
  /* Raw terrarium metres, unclamped. Terrarium is documented as encoding bathymetry
     negative over ocean; whether it actually does here is what the probe measures. */
  'float decodeRaw(vec4 c){'+
  '  return (c.r*255.0*256.0 + c.g*255.0 + c.b*255.0/256.0) - 32768.0; }'+
  'float decodeH(vec4 c){'+
  '  float h=decodeRaw(c);'+
  /* Terrarium encodes BATHYMETRY as negative heights. The sea surface is flat,
     so clamp to sea level — otherwise underwater mountains cast shadows on the
     ocean. Coastal cliffs still cast onto the water correctly. */
  '  return max(h,0.0); }';

var layer={
  id:'shadow', type:'custom', renderingMode:'2d', tiles:{}, clock:0,

  onAdd:function(m,gl){
    var quadVS='attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos*2.0-1.0,0.0,1.0); }';

    /* ---- PASS 1: copy tile -> atlas ---- */
    var v1='attribute vec2 a_pos; varying vec2 v_uv; uniform vec4 u_tile; uniform vec4 u_atlas;'+
      'void main(){ v_uv=a_pos;'+
      ' vec2 merc=u_tile.xy+a_pos*u_tile.zw;'+
      ' vec2 uv=(merc-u_atlas.xy)/u_atlas.zw;'+
      ' gl_Position=vec4(uv*2.0-1.0,0.0,1.0); }';
    /* The atlas is usually FINER than the DEM, so a straight copy replicates each sample
       across several texels — flat square plateaus, which read as a grid in the shadows.
       Interpolate on DECODED metres here, then re-encode, so the atlas holds a smooth
       surface whatever the atlas/DEM ratio happens to be. */
    var f1='precision highp float; varying vec2 v_uv;'+
      'uniform sampler2D u_tex; uniform vec2 u_tpx;'+
      GLSL_DEM+
      'void main(){'+
      '  vec2 t=v_uv*u_tpx-0.5, f=fract(t), b=(floor(t)+0.5)/u_tpx, e=1.0/u_tpx;'+
      '  float r00=decodeRaw(texture2D(u_tex,b));'+
      '  float r10=decodeRaw(texture2D(u_tex,b+vec2(e.x,0.0)));'+
      '  float r01=decodeRaw(texture2D(u_tex,b+vec2(0.0,e.y)));'+
      '  float r11=decodeRaw(texture2D(u_tex,b+e));'+
      '  float raw=mix(mix(r00,r10,f.x),mix(r01,r11,f.x),f.y);'+
      '  float h=max(raw,0.0);'+          /* the sea SURFACE is flat, whatever lies beneath */
      '  float v=h+32768.0;'+
      '  float r=floor(v/256.0);'+
      '  float g=floor(v-r*256.0);'+
      '  float bl=floor((v-r*256.0-g)*256.0);'+
      '  gl_FragColor=vec4(r/255.0,g/255.0,bl/255.0,1.0); }';
    this.pCopy=link(gl,compile(gl,gl.VERTEX_SHADER,v1,'copy.vs'),
                       compile(gl,gl.FRAGMENT_SHADER,f1,'copy.fs'),'copy');
    this.cPos=gl.getAttribLocation(this.pCopy,'a_pos');
    this.cTile=gl.getUniformLocation(this.pCopy,'u_tile');
    this.cAtlas=gl.getUniformLocation(this.pCopy,'u_atlas');
    this.cTex=gl.getUniformLocation(this.pCopy,'u_tex');
    this.cTpx=gl.getUniformLocation(this.pCopy,'u_tpx');

    /* ---- self-test source: a cylinder of known height on a flat plane, so the correct
       shadow is a closed-form rectangle H/tan(alt) long, capped with a semicircle ---- */
    var fT='precision highp float; uniform vec2 u_px; uniform float u_R, u_H;'+
      'uniform vec2 u_o0, u_o1, u_o2, u_o3;'+
      'void main(){'+
      '  vec2 p=gl_FragCoord.xy-u_px*0.5;'+
      '  float h=0.0;'+
      '  if(length(p-u_o0*u_px)<u_R) h=u_H;'+
      '  if(length(p-u_o1*u_px)<u_R) h=u_H;'+
      '  if(length(p-u_o2*u_px)<u_R) h=u_H;'+
      '  if(length(p-u_o3*u_px)<u_R) h=u_H;'+
      '  float v=h+32768.0;'+
      '  float r=floor(v/256.0);'+
      '  float g=floor(v-r*256.0);'+
      '  float b=floor((v-r*256.0-g)*256.0);'+
      '  gl_FragColor=vec4(r/255.0,g/255.0,b/255.0,1.0); }';
    this.pTest=link(gl,compile(gl,gl.VERTEX_SHADER,quadVS,'test.vs'),
                       compile(gl,gl.FRAGMENT_SHADER,fT,'test.fs'),'test');
    this.tPos=gl.getAttribLocation(this.pTest,'a_pos');
    this.tPx=gl.getUniformLocation(this.pTest,'u_px');
    this.tR=gl.getUniformLocation(this.pTest,'u_R');
    this.tH=gl.getUniformLocation(this.pTest,'u_H');
    this.tO=[];
    for(var oi=0;oi<4;oi++) this.tO.push(gl.getUniformLocation(this.pTest,'u_o'+oi));

    /* ---- max-height reduction: 8x8 at a time, down to a single texel ----
       The longest shadow is maxHeight/tan(alt), so the computed area is sized by the tallest
       thing actually in view. Assuming Everest everywhere costs resolution in proportion. */
    var fR='precision highp float;'+
      'uniform sampler2D u_src; uniform vec2 u_srcPx; uniform float u_taps;'+
      GLSL_DEM+
      'void main(){'+
      '  vec2 base=(gl_FragCoord.xy-0.5)*u_taps;'+
      '  float m=0.0;'+
      '  for(int j=0;j<8;j++){'+
      '    if(float(j)>=u_taps) break;'+
      '    for(int i=0;i<8;i++){'+
      '      if(float(i)>=u_taps) break;'+
      '      vec2 uv=(base+vec2(float(i),float(j))+0.5)/u_srcPx;'+
      '      m=max(m,decodeH(texture2D(u_src,uv)));'+
      '    } }'+
      '  float v=m+32768.0;'+
      '  float r=floor(v/256.0);'+
      '  float g=floor(v-r*256.0);'+
      '  float b=floor((v-r*256.0-g)*256.0);'+
      '  gl_FragColor=vec4(r/255.0,g/255.0,b/255.0,1.0); }';
    this.pRed=link(gl,compile(gl,gl.VERTEX_SHADER,quadVS,'red.vs'),
                      compile(gl,gl.FRAGMENT_SHADER,fR,'red.fs'),'red');
    this.dPos=gl.getAttribLocation(this.pRed,'a_pos');
    this.dSrc=gl.getUniformLocation(this.pRed,'u_src');
    this.dSrcPx=gl.getUniformLocation(this.pRed,'u_srcPx');
    this.dTaps=gl.getUniformLocation(this.pRed,'u_taps');

    /* ---- PASS 2: atlas -> g, in sun-aligned axes ----
       u points at the sun and becomes +x. A square rotated by t has a bounding box
       (|cos t|+|sin t|) larger, so one rotated texel is u_k atlas texels (1.0 … 1.41). */
    var f2='precision highp float;'+
      'uniform sampler2D u_dem; uniform vec2 u_px; uniform vec2 u_u;'+
      'uniform float u_k, u_T, u_gLo, u_gInv;'+
      GLSL_DEM+GLSL_PACK+
      'float hBil(vec2 uv){'+
      '  vec2 t=uv*u_px-0.5, f=fract(t), b=(floor(t)+0.5)/u_px, e=1.0/u_px;'+
      '  float h00=decodeH(texture2D(u_dem,b));'+
      '  float h10=decodeH(texture2D(u_dem,b+vec2(e.x,0.0)));'+
      '  float h01=decodeH(texture2D(u_dem,b+vec2(0.0,e.y)));'+
      '  float h11=decodeH(texture2D(u_dem,b+e));'+
      '  return mix(mix(h00,h10,f.x),mix(h01,h11,f.x),f.y); }'+
      'void main(){'+
      '  vec2 c=u_px*0.5, v=vec2(-u_u.y,u_u.x);'+
      '  vec2 q=gl_FragCoord.xy-c;'+
      '  vec2 p=c+(q.x*u_k)*u_u+(q.y*u_k)*v;'+
      '  vec2 uv=p/u_px;'+
      /* Outside the atlas, or where no DEM loaded, contribute nothing: the range minimum
         can never exceed another pixel's g, so it can never cast a shadow. */
      '  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0){ gl_FragColor=packG(0.0); return; }'+
      '  if(texture2D(u_dem,uv).a<0.5){ gl_FragColor=packG(0.0); return; }'+
      '  float s=q.x*u_k;'+          /* distance along the sun direction, in atlas texels */
      '  gl_FragColor=packG((hBil(uv)-s*u_T-u_gLo)*u_gInv); }';
    this.pInit=link(gl,compile(gl,gl.VERTEX_SHADER,quadVS,'rot.vs'),
                       compile(gl,gl.FRAGMENT_SHADER,f2,'rot.fs'),'rot');
    this.iPos=gl.getAttribLocation(this.pInit,'a_pos');
    this.iDem=gl.getUniformLocation(this.pInit,'u_dem');
    this.iPx=gl.getUniformLocation(this.pInit,'u_px');
    this.iSun=gl.getUniformLocation(this.pInit,'u_u');
    this.iK=gl.getUniformLocation(this.pInit,'u_k');
    this.iT=gl.getUniformLocation(this.pInit,'u_T');
    this.iLo=gl.getUniformLocation(this.pInit,'u_gLo');
    this.iInv=gl.getUniformLocation(this.pInit,'u_gInv');

    /* ---- PASS 3: doubling scan ---- */
    var f3='precision highp float;'+
      'uniform sampler2D u_src; uniform vec2 u_px; uniform vec2 u_off; uniform float u_seed;'+
      GLSL_PACK+
      'void main(){'+
      '  vec2 uv=gl_FragCoord.xy/u_px;'+
      '  vec2 uv2=uv+u_off/u_px;'+
      /* Off-atlas reads must not invent a blocker, so they return the range minimum.
         CLAMP_TO_EDGE would smear the border value inward and streak shadows. */
      '  float b=(uv2.x<0.0||uv2.x>1.0||uv2.y<0.0||uv2.y>1.0) ? 0.0 : unpackG(texture2D(u_src,uv2));'+
      /* seed pass takes ONLY the shifted sample: the running max must be over ground
         STRICTLY upstream, never including the pixel itself. */
      '  float a=(u_seed>0.5) ? 0.0 : unpackG(texture2D(u_src,uv));'+
      '  gl_FragColor=packG(max(a,b)); }';
    this.pScan=link(gl,compile(gl,gl.VERTEX_SHADER,quadVS,'scan.vs'),
                       compile(gl,gl.FRAGMENT_SHADER,f3,'scan.fs'),'scan');
    this.sPos=gl.getAttribLocation(this.pScan,'a_pos');
    this.sSrc=gl.getUniformLocation(this.pScan,'u_src');
    this.sPx=gl.getUniformLocation(this.pScan,'u_px');
    this.sOff=gl.getUniformLocation(this.pScan,'u_off');
    this.sSeed=gl.getUniformLocation(this.pScan,'u_seed');

    /* ---- PASS 4: shade ---- */
    var v4='attribute vec2 a_pos; varying vec2 v_uv; uniform mat4 u_matrix; uniform vec4 u_atlas;'+
      'void main(){ v_uv=a_pos;'+
      ' vec2 merc=u_atlas.xy+a_pos*u_atlas.zw;'+
      ' gl_Position=u_matrix*vec4(merc,0.0,1.0); }';
    var f4='precision highp float;'+
      'varying vec2 v_uv;'+
      'uniform sampler2D u_dem; uniform sampler2D u_scan;'+
      'uniform vec2 u_px; uniform vec2 u_u;'+
      'uniform float u_k, u_T, u_gLo, u_gInv, u_debug, u_synth, u_R, u_H, u_cmp;'+
      'uniform vec2 u_s0, u_s1, u_s2, u_s3;'+
      GLSL_DEM+GLSL_PACK+
      /* Terrain is point samples, not flat blocks. NEAREST filtering is mandatory (linear
         would blend the ENCODED rgb and yield garbage), so interpolate in the shader on
         DECODED values instead. Without this, every texel is a square plateau and casts a
         square-edged shadow — the blocky "digital" look. */
      'float hAt(vec2 uv){'+
      '  vec2 t=uv*u_px-0.5, f=fract(t), b=(floor(t)+0.5)/u_px, e=1.0/u_px;'+
      '  float h00=decodeH(texture2D(u_dem,b));'+
      '  float h10=decodeH(texture2D(u_dem,b+vec2(e.x,0.0)));'+
      '  float h01=decodeH(texture2D(u_dem,b+vec2(0.0,e.y)));'+
      '  float h11=decodeH(texture2D(u_dem,b+e));'+
      '  return mix(mix(h00,h10,f.x),mix(h01,h11,f.x),f.y); }'+
      'float maxAt(vec2 uv){'+
      '  vec2 t=uv*u_px-0.5, f=fract(t), b=(floor(t)+0.5)/u_px, e=1.0/u_px;'+
      '  float a00=unpackG(texture2D(u_scan,b));'+
      '  float a10=unpackG(texture2D(u_scan,b+vec2(e.x,0.0)));'+
      '  float a01=unpackG(texture2D(u_scan,b+vec2(0.0,e.y)));'+
      '  float a11=unpackG(texture2D(u_scan,b+e));'+
      '  return mix(mix(a00,a10,f.x),mix(a01,a11,f.x),f.y); }'+
      /* A plain march over the SAME atlas: one texel per step, no rotation, no running
         maximum. Slow, but it shares nothing with the scan except the terrain, so where the
         two disagree the fault is in whichever is not this. */
      'bool march(vec2 uv){'+
      '  float h0=hAt(uv);'+
      '  for(int i=1;i<=512;i++){'+
      '    float d=float(i);'+
      '    vec2 uv2=uv+u_u*d/u_px;'+
      '    if(uv2.x<0.0||uv2.x>1.0||uv2.y<0.0||uv2.y>1.0) return false;'+

  /* (Re)allocate the three targets when the canvas size bucket changes. Power of two so
     the doubling scan reaches exactly the atlas width in log2(px) passes. */
  resize:function(gl){

      self[k]=rgbaTarget(gl,px);

    this.red=[];

      var t=rgbaTarget(gl,next); t.taps=Math.ceil(rs/next); t.out=next;

    this.scanTex=null;   /* old scan texture was just deleted; never bind it again */
    this.good=null;      /* and the atlas contents are gone with it */
    this.levels=Math.round(Math.log(px)/Math.LN2);

  /* Tiles covering an explicit mercator rect at a given DEM zoom. Longitude wraps, so a
     view spanning the antimeridian needs no special case. */
  wanted:function(rect,z){
    var n=Math.pow(2,z), out=[];
    var x0=Math.floor(rect[0]*n), x1=Math.floor((rect[0]+rect[2])*n);
    var y0=Math.floor(rect[1]*n), y1=Math.floor((rect[1]+rect[2])*n);
    for(var x=x0;x<=x1;x++) for(var y=y0;y<=y1;y++){

    }

  },

  tileCount:function(rect,z){
    var n=Math.pow(2,z);
    var nx=Math.floor((rect[0]+rect[2])*n)-Math.floor(rect[0]*n)+1;
    var y0=Math.max(0,Math.floor(rect[1]*n));
    var y1=Math.min(n-1,Math.floor((rect[1]+rect[2])*n));

  /* LRU: drop the least-recently-used textures once the cache exceeds its cap.

    if(keys.length<=TILE_CACHE_MAX) return;
    keys.sort(function(a,b){ return (self.tiles[a].used||0)-(self.tiles[b].used||0); });
    var live=keys.length;
    for(var i=0;i<keys.length && live>TILE_CACHE_MAX;i++){
      var k=keys[i]; if(keep[k]) continue;

  load:function(gl,t){
    var key=t.z+'/'+t.x+'/'+t.y, self=this;
    if(this.tiles[key]){ this.tiles[key].used=++this.clock; return this.tiles[key]; }
    var rec={tex:null,ready:false,used:++this.clock}; this.tiles[key]=rec;
    var img=new Image(); img.crossOrigin='anonymous';
    img.onload=function(){
      var tex=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);

      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);

         colour profile on upload, and one count of drift in the red channel is a 256 m
         elevation error. Premultiply would corrupt them too. Both must be off, and the
         state is global, so it is set immediately before every upload. */
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);

      rec.ready=true; rec.failed=true;
      if(!self._terr){ self._terr=true; L('✗ tile failed (CORS/network): '+key); }
      map.triggerRepaint();

  status:function(s,z,drawn,want,texelM,PX,note,kRot,hmax){

      new Date(BASE+offsetMin*60000).toISOString().replace('T',' ').slice(0,19)+
      ' UTC  alt '+s.alt.toFixed(1)+'° az '+s.az.toFixed(1)+'°'+
      '  z'+z+'  '+drawn+'/'+want+' tiles  atlas '+PX+'²'+
      '  texel '+texelM.toFixed(0)+'m  hmax '+(hmax||0)+'m'+
      (note?('  — '+note):'');
  },

  /* Reduce the atlas to a single texel holding its maximum height, and read that one pixel
     back. Runs on the GPU: the earlier main-thread version of this caused visible judder. */
  measureMax:function(gl){
    var src=this.atlas.tex;
    gl.useProgram(this.pRed);
    for(var i=0;i<this.red.length;i++){
      var t=this.red[i];

      gl.viewport(0,0,t.out,t.out);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src);
      gl.uniform1i(this.dSrc,0);
      gl.uniform2f(this.dSrcPx,t.srcPx,t.srcPx);
      gl.uniform1f(this.dTaps,t.taps);

  quad:function(gl,loc){

  },

  render:function(gl,args){

    /* MapLibre v5 passes an options object, not a bare matrix array. */
    var matrix=args;
    if(args && !args.length)
      matrix=(args.defaultProjectionData&&args.defaultProjectionData.mainMatrix)||args.mainMatrix||args.matrix;
    if(!matrix||!matrix.length){
      if(!this._noMat){ this._noMat=true; L('✗ R2. no usable matrix; args keys: '+Object.keys(args||{}).join(',')); }
      return;
    }
    if(!this._gotMat){ this._gotMat=true; L('R2. matrix ok ✓'); }
    this.resize(gl);
    var PX=this.px;

    /* ---------- atlas rect ----------
       Anchored on the VIEWPORT, not on tile boundaries: its size depends only on zoom, so
       panning translates the grid instead of resizing it and the shadows stay put. The
       origin is snapped to a whole texel so that translation is exact. */
    var bb=map.getBounds();
    var bx0=mx(bb.getWest()), bx1=mx(bb.getEast());
    if(bx1<bx0) bx1+=1;                         /* view crosses the antimeridian */
    var by0=my(bb.getNorth()), by1=my(bb.getSouth());
    var c=map.getCenter();
    var mPerMerc=40075016.686*Math.cos(c.lat*RAD);
    var sun=sunAltAz(BASE+offsetMin*60000, c.lat, c.lng);

    /* The computed area must hold every blocker that can reach the view, so its size follows
       from the SUN, not the zoom: the longest possible shadow is maxTerrainHeight/tan(alt).
       Sizing it to the viewport (as before) silently truncated every shadow longer than the
       screen — which at a low sun is all of them. Symmetric about the view rather than
       offset toward the sun, so that scrubbing time does not move the grid. */

           that made this tracer disagree with its own renderer. */

              ' (ray was at '+(h0+hit.st*T).toFixed(0)+' m there)');

    /* ---------- sun geometry ---------- */
    var s=sun;
    var azr=s.az*RAD;
    /* mercator y grows southward, so north is -y */

    var tanAlt=Math.tan(Math.max(s.alt,0.05)*RAD);

      return;

    /* How much does the sun altitude actually vary across this view? */
    var dAlt=0;
    for(var ci=0;ci<4;ci++){
      var cLat=latFromMercY(ci<2?by0:by1), cLon=((ci%2)?bx1:bx0)*360-180;
      dAlt=Math.max(dAlt,Math.abs(sunAltAz(BASE+offsetMin*60000,cLat,cLon).alt-s.alt));
    }
    var altR=Math.max(s.alt,0.05)*RAD;
    var tolDeg=SUN_LEN_TOL*Math.sin(altR)*Math.cos(altR)/RAD;
    if(dAlt>tolDeg){
      this.status(s,demZ,drawn,list.length,texelM,PX,
        'view too wide for one sun vector (varies '+dAlt.toFixed(1)+'°, limit '+
        tolDeg.toFixed(1)+'°) — zoom in',kRot,this.terrainMax);
      return;
    }

    /* ---------- PASS 2: atlas -> g ---------- */
    {
      gl.bindFramebuffer(gl.FRAMEBUFFER,this.ping.fbo);
      gl.viewport(0,0,PX,PX);
      gl.useProgram(this.pInit);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,this.atlas.tex);
      gl.uniform1i(this.iDem,0);
      gl.uniform2f(this.iPx,PX,PX);
      gl.uniform2f(this.iSun,sunx,suny);
      gl.uniform1f(this.iK,kRot);
      gl.uniform1f(this.iT,T);
      gl.uniform1f(this.iLo,gLo);
      gl.uniform1f(this.iInv,gInv);
      this.quad(gl,this.iPos);

      /* ---------- PASS 3: doubling scan ----------
         Seed covers offset {1}; level k then folds in {2^k}. After this.levels passes the
         result is the max over offsets 1 … PX upstream. Offsets are (n,0): whole texels. */
      var src=this.ping, dst=this.pong;
      gl.useProgram(this.pScan);
      gl.uniform2f(this.sPx,PX,PX);
      for(var k=-1;k<this.levels;k++){
        var off=(k<0)?1:Math.pow(2,k);
        gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fbo);
        gl.viewport(0,0,PX,PX);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src.tex);
        gl.uniform1i(this.sSrc,0);
        gl.uniform2f(this.sOff,off,0.0);   /* exact whole texels: the sun is +x here */
        gl.uniform1f(this.sSeed,k<0?1:0);
        this.quad(gl,this.sPos);
        var tmp=src; src=dst; dst=tmp;
      }
      this.scanTex=src.tex;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);

    /* ---------- PASS 4: shade ---------- */
    var cv=gl.canvas;
    gl.viewport(0,0,cv.width,cv.height);
    gl.useProgram(this.pShade);
    gl.uniformMatrix4fv(this.hMatrix,false,matrix);
    gl.uniform4f(this.hAtlas,x0,y0,a,a);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,this.atlas.tex);
    gl.uniform1i(this.hDem,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,this.scanTex||this.atlas.tex);
    gl.uniform1i(this.hScan,1);
    gl.uniform2f(this.hPx,PX,PX);
    gl.uniform2f(this.hSun,sunx,suny);
    gl.uniform1f(this.hK,kRot);
    gl.uniform1f(this.hT,T);
    gl.uniform1f(this.hLo,gLo);
    gl.uniform1f(this.hInv,gInv);
    gl.uniform1f(this.hDebug,document.getElementById('dem').checked?1:0);
    gl.uniform1f(this.hSynth,synth?1:0);
    gl.uniform1f(this.hCmp,document.getElementById('cmp').checked?1:0);
    for(var si2=0;si2<4;si2++)
      gl.uniform2f(this.hS[si2],TEST_OFF[si2][0]*vSpan/a,TEST_OFF[si2][1]*vSpan/a);
    gl.uniform1f(this.hR,PX*TEST_R_FRAC*vSpan/a);
    gl.uniform1f(this.hH,TEST_H);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    this.quad(gl,this.hPos);
    gl.activeTexture(gl.TEXTURE0);

    if(!this._rep){ this._rep=true; L('E. scan running — '+drawn+' tiles, atlas '+PX+'², '+(this.levels+1)+' passes'); }
    this.status(s,demZ,drawn,list.length,texelM,PX,
                synth
                  ? ('SELF-TEST: cylinder '+TEST_H+' m -> shadow should be '+
                     (TEST_H/tanAlt/1000).toFixed(2)+' km ('+(TEST_H/tanAlt/texelM).toFixed(0)+
                     ' texels) toward az '+(((s.az+180)%360)).toFixed(1)+'°; magenta = mismatch')
                  : ((drawn<list.length)?'holding last complete atlas':null),
                kRot,this.terrainMax);
    /* Benchmark: repaint continuously and report a rolling frame rate, so the cost of a
       bigger atlas is MEASURED on the target device rather than assumed. */
    if(document.getElementById('bench').checked){
      var now=performance.now();
      if(this._last){
        this._ema=this._ema? this._ema*0.9+(now-this._last)*0.1 : (now-this._last);
        document.getElementById('fps').textContent=
          '  '+(1000/this._ema).toFixed(0)+' fps ('+this._ema.toFixed(1)+' ms/frame)';
      }
      this._last=now;
      map.triggerRepaint();
    } else { this._last=0; this._ema=0; document.getElementById('fps').textContent=''; }
  }
};

/* Click the map to print the elevation at that point twice: straight from the source PNG,
   and from our atlas after decode -> clamp -> re-encode. If they disagree, the offset is
   ours and nothing about the data needs fixing. */
/* Probe output goes to the status line, which is always on screen — the trace panel is
   hidden by default and results were landing where nobody could see them. */
var probeOut=[];
function say(m){
  probeOut.push(m);
  document.getElementById('probe').textContent=probeOut.join('   |   ');
  L('   '+m);
}

function probeTile(lng,lat,z){
  var n=Math.pow(2,z);
  var xt=mx(lng)*n, yt=my(lat)*n;
  var tx=Math.floor(xt), ty=Math.floor(yt);
  /* Read the SAME bytes the texture upload reads. A 2D canvas colour-manages what it draws,
     which shifts channel values by a count or two — invisible in a photo, but one count of
     red is 256 metres here. createImageBitmap with conversion off matches WebGL's NONE. */
  function decodeAt(bmp,W){
    var ix=Math.min(W-1,Math.floor((xt-tx)*W)), iy=Math.min(W-1,Math.floor((yt-ty)*W));
    var cv=document.createElement('canvas'); cv.width=cv.height=W;
    var cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(bmp,0,0);
    var d=cx.getImageData(ix,iy,1,1).data;
    var raw=d[0]*256+d[1]+d[2]/256-32768;
    say('source z'+z+'/'+tx+'/'+ty+' ('+W+'px) = '+raw.toFixed(2)+' m  rgb('+d[0]+','+d[1]+','+d[2]+')');
    /* Is the source genuinely this resolution, or upsampled from something coarser? Count
       DISTINCT values in a 7x7 block. Real data at this scale gives ~49; a handful means
       plateaus, and plateaus are what a low sun stretches into staircase shadow edges. */
    var N=7, x0=Math.max(0,Math.min(W-N,ix-3)), y0=Math.max(0,Math.min(W-N,iy-3));
    var blk=cx.getImageData(x0,y0,N,N).data, seen={}, lo=1e9, hi=-1e9;
    for(var i=0;i<N*N;i++){
      var o=i*4, v=blk[o]*256+blk[o+1]+blk[o+2]/256-32768;
      seen[v.toFixed(3)]=1; if(v<lo)lo=v; if(v>hi)hi=v;
    }
    var k=Object.keys(seen).length;
    /* min and max matter as much as the count: if OUR value appears somewhere in this
       neighbourhood, the lookup is in the wrong place; if it sits 256 m below everything
       here, it is an encoding fault. The two need opposite fixes. */
    say('source 7x7: '+k+'/49 distinct, '+lo.toFixed(1)+' to '+hi.toFixed(1)+' m'+
        (k<=12?'  [plateaus: upsampled]':'  [genuine detail]'));
  }

  fetch(TERRARIUM+z+'/'+tx+'/'+ty+'.png').then(function(r){ return r.blob(); })
   .then(function(b){
     if(!self.createImageBitmap) throw new Error('no createImageBitmap');
     return createImageBitmap(b,{colorSpaceConversion:'none',premultiplyAlpha:'none'});
   })
   .then(function(bmp){ decodeAt(bmp,bmp.width); })
   .catch(function(e){ say('✗ source read failed: '+e.message); });
}

/* Mark the click. Two probes in a row landed on lit ground while aiming at a shadow, and
   there is no way to tell from a screenshot where the click actually went. */
var probeMark=null;
map.on('click',function(e){
  if(!probeMark){
    var el=document.createElement('div');
    el.style.cssText='width:13px;height:13px;border:2px solid #fff;border-radius:50%;'+
      'background:#f0f;box-shadow:0 0 0 1px #000';
    probeMark=new maplibregl.Marker({element:el});
  }
  probeMark.setLngLat(e.lngLat).addTo(map);
  layer.probe=e.lngLat;
  probeOut.length=0;
  say('probe '+e.lngLat.lat.toFixed(4)+','+e.lngLat.lng.toFixed(4));
  map.triggerRepaint();
});

map.on('load',function(){
  L('C. adding scan layer');
  map.addLayer(layer);
});
document.getElementById('dem').addEventListener('change',function(){ map.triggerRepaint(); });
document.getElementById('test').addEventListener('change',function(){ map.triggerRepaint(); });
document.getElementById('cmp').addEventListener('change',function(){ map.triggerRepaint(); });
document.getElementById('tl').addEventListener('click',function(){
  log.classList.toggle('on');
});
document.getElementById('t').addEventListener('input',function(e){
  offsetMin=parseInt(e.target.value,10); map.triggerRepaint();
});
</script>
