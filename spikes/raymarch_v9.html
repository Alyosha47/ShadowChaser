<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>raymarch v9 — terrain shadows</title>
<link href="vendor/maplibre-gl-5.5.0.css" rel="stylesheet">
<script src="vendor/maplibre-gl-csp-5.5.0.js"></script>
<script>
  if (window.maplibregl && maplibregl.setWorkerUrl)
    maplibregl.setWorkerUrl('vendor/maplibre-gl-csp-worker-5.5.0.js');
</script>
<style>
  html,body{margin:0;height:100%}
  #map{position:absolute;inset:0}
  #log{position:absolute;top:0;left:0;right:0;z-index:9;font:13px/1.4 monospace;
       white-space:pre-wrap;padding:8px 10px;color:#8f8;background:rgba(0,0,0,.75)}
  #log b{color:#ffd27a}
  #ui{position:absolute;bottom:0;left:0;right:0;z-index:9;padding:10px;
      background:rgba(0,0,0,.72);color:#eee;font:13px monospace}
  #t{width:100%}
</style>
<div id="map"></div>
<div id="log">raymarch v9 (geometric step) — starting…
</div>
<div id="ui">
  <input id="t" type="range" min="-180" max="180" value="0" step="1">
  <div id="tl">…</div>
</div>
<script>
var log=document.getElementById('log');
function L(m){ log.textContent += m+"\n"; }
window.onerror=function(m,s,ln){ L('✗ '+m+' @'+ln); };

/* ── Stage 2: GPU terrain-shadow raymarch ─────────────────────────────────
   PASS 1  draw DEM tiles into one off-screen atlas texture (so rays can cross
           tile boundaries — the blocking ridge is usually in a neighbour tile)
   PASS 2  full-screen quad: per pixel, march toward the sun through the atlas
           and test whether terrain rises above the sightline.
   Same maths as the validated sunmap spike, moved from JS to GLSL.           */

var TERRARIUM='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/';
var DEM_Z_MAX=12, ATLAS=1024;
var TILE_BUDGET=25;                   /* max DEM tiles per frame; DEM zoom drops until it fits */
var TILE_CACHE_MAX=200;               /* LRU cap on retained tile textures */
var MARCH_FRAC=0.40, MARCH_MIN=2000, MARCH_MAX=80000;
                                      /* march distance = 40% of the atlas span, clamped */
var MAX_TERRAIN_H=9000;               /* no ridge on Earth casts from higher than this */
var STEP_TEXELS=0.75, STEPS_MIN=8, STEPS_MAX=128;
                                      /* step <= 0.75 texel: below this the ray steps OVER
                                         ridges and leaves 1-px speckle streaks */
var BIAS_M=2.0;                       /* depth bias: kills self-shadowing on flat ground */
var LAT0=41.9851, LON0=-3.4186;
var BASE=Date.parse('2026-08-12T18:28:41Z');   /* eclipse max over Spain */
var offsetMin=0;

/* verified solar position (matches the app to ~0.2°) */
var RAD=Math.PI/180;
function sunAltAz(ms,lat,lon){
  var n=ms/86400000+2440587.5-2451545.0;
  var Lo=(((280.460+0.9856474*n)%360)+360)%360, g=((((357.528+0.9856003*n)%360)+360)%360)*RAD;
  var lam=(Lo+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*n)*RAD;
  var al=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), de=Math.asin(Math.sin(eps)*Math.sin(lam));
  var gmst=((((280.46061837+360.98564736629*n)%360))+360)%360, ha=(gmst+lon)*RAD-al, la=lat*RAD;
  var alt=Math.asin(Math.sin(la)*Math.sin(de)+Math.cos(la)*Math.cos(de)*Math.cos(ha));
  var az=Math.atan2(-Math.sin(ha),Math.tan(de)*Math.cos(la)-Math.sin(la)*Math.cos(ha));
  return { alt:alt/RAD, az:((az/RAD)+360)%360 };
}

var map=new maplibregl.Map({
  container:'map',
  style:{version:8,
    sources:{ osm:{ type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                    tileSize:256, attribution:'© OpenStreetMap' } },
    layers:[{id:'osm',type:'raster',source:'osm'}]},
  center:[LON0,LAT0], zoom:10
});
L('A. map created');

function compile(gl,type,src,tag){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) L('✗ '+tag+': '+gl.getShaderInfoLog(s));
  return s;
}
function link(gl,vs,fs,tag){
  var p=gl.createProgram(); gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) L('✗ link '+tag+': '+gl.getProgramInfoLog(p));
  return p;
}

var layer={
  id:'shadow', type:'custom', renderingMode:'2d', tiles:{}, clock:0,
  onAdd:function(m,gl){
    /* ---- PASS 1: copy tile -> atlas ---- */
    var v1='attribute vec2 a_pos; varying vec2 v_uv; uniform vec4 u_tile; uniform vec4 u_atlas;'+
      'void main(){ v_uv=a_pos;'+
      ' vec2 merc=u_tile.xy+a_pos*u_tile.zw;'+
      ' vec2 uv=(merc-u_atlas.xy)/u_atlas.zw;'+
      ' gl_Position=vec4(uv*2.0-1.0,0.0,1.0); }';
    var f1='precision highp float; varying vec2 v_uv; uniform sampler2D u_tex;'+
      'void main(){ gl_FragColor=texture2D(u_tex,v_uv); }';
    this.pCopy=link(gl,compile(gl,gl.VERTEX_SHADER,v1,'copy.vs'),
                       compile(gl,gl.FRAGMENT_SHADER,f1,'copy.fs'),'copy');
    this.cPos=gl.getAttribLocation(this.pCopy,'a_pos');
    this.cTile=gl.getUniformLocation(this.pCopy,'u_tile');
    this.cAtlas=gl.getUniformLocation(this.pCopy,'u_atlas');
    this.cTex=gl.getUniformLocation(this.pCopy,'u_tex');

    /* ---- PASS 2: raymarch ---- */
    var v2='attribute vec2 a_pos; varying vec2 v_uv; uniform mat4 u_matrix; uniform vec4 u_atlas;'+
      'void main(){ v_uv=a_pos;'+
      ' vec2 merc=u_atlas.xy+a_pos*u_atlas.zw;'+
      ' gl_Position=u_matrix*vec4(merc,0.0,1.0); }';
    var f2='precision highp float;'+
      'varying vec2 v_uv;'+
      'uniform sampler2D u_dem;'+
      'uniform vec2  u_sun;        /* horizontal dir toward sun, mercator space */'+
      'uniform float u_tanAlt;     /* tan(sun altitude) */'+
      'uniform float u_mPerMerc;   /* metres per 1.0 mercator unit at this latitude */'+
      'uniform vec2  u_atlasSize;  /* atlas span in mercator units */'+
      'uniform float u_stepM;    /* FIRST step; grows by u_ratio each iteration */'+
      'uniform float u_ratio;'+
      'uniform float u_steps;'+
      'uniform float u_night;'+
      'uniform float u_bias;'+
      'uniform vec2  u_atlasPx;    /* atlas size in texels */'+
      'float decode(vec4 c){'+
      '  float h=(c.r*255.0*256.0 + c.g*255.0 + c.b*255.0/256.0) - 32768.0;'+
      /* Terrarium encodes BATHYMETRY as negative heights. The sea surface is flat,
         so clamp to sea level — otherwise underwater mountains cast shadows on
         the ocean. Coastal cliffs still cast onto the water correctly. */
      '  return max(h, 0.0); }'+
      /* Terrain is point samples, not flat blocks. NEAREST filtering is mandatory (linear
         would blend the ENCODED rgb and yield garbage), so interpolate in the shader on
         DECODED metres instead. Without this, every texel is a square plateau and casts a
         square-edged shadow — the blocky "digital" look. */
      'float hAt(vec2 uv){'+
      '  vec2 t=uv*u_atlasPx-0.5, f=fract(t), b=(floor(t)+0.5)/u_atlasPx;'+
      '  vec2 e=1.0/u_atlasPx;'+
      '  float h00=decode(texture2D(u_dem,b));'+
      '  float h10=decode(texture2D(u_dem,b+vec2(e.x,0.0)));'+
      '  float h01=decode(texture2D(u_dem,b+vec2(0.0,e.y)));'+
      '  float h11=decode(texture2D(u_dem,b+e));'+
      '  return mix(mix(h00,h10,f.x),mix(h01,h11,f.x),f.y); }'+
      'void main(){'+
      '  if(u_night>0.5){ gl_FragColor=vec4(0.02,0.03,0.10,0.55); return; }'+
      '  float h0=hAt(v_uv);'+
      '  bool shadow=false;'+
      /* Geometric stepping: texel-fine near the receiver (which is what closes the gap at
         a hill's foot) and progressively coarser far away, where any blocker still able to
         reach this pixel is necessarily large. u_ratio is 1.0 whenever uniform stepping
         already covers the march, so short marches behave exactly as before. */
      '  float d=0.0, stepM=u_stepM;'+
      '  for(int i=1;i<=128;i++){'+
      '    if(float(i)>u_steps) break;'+
      '    d+=stepM; stepM*=u_ratio;'+
      '    vec2 duv=(u_sun*(d/u_mPerMerc))/u_atlasSize;'+
      '    vec2 uv=v_uv+duv;'+
      '    if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0) break;'+
      '    float h=hAt(uv);'+
      '    float rayH=h0 + d*u_tanAlt;'+
      '    if(h>rayH+u_bias){ shadow=true; break; }'+
      '  }'+
      '  if(!shadow) discard;'+
      '  gl_FragColor=vec4(0.02,0.05,0.16,0.55);'+
      '}';
    this.pRay=link(gl,compile(gl,gl.VERTEX_SHADER,v2,'ray.vs'),
                      compile(gl,gl.FRAGMENT_SHADER,f2,'ray.fs'),'ray');
    this.rPos=gl.getAttribLocation(this.pRay,'a_pos');
    this.rMatrix=gl.getUniformLocation(this.pRay,'u_matrix');
    this.rAtlas=gl.getUniformLocation(this.pRay,'u_atlas');
    this.rDem=gl.getUniformLocation(this.pRay,'u_dem');
    this.rSun=gl.getUniformLocation(this.pRay,'u_sun');
    this.rTan=gl.getUniformLocation(this.pRay,'u_tanAlt');
    this.rMpm=gl.getUniformLocation(this.pRay,'u_mPerMerc');
    this.rSize=gl.getUniformLocation(this.pRay,'u_atlasSize');
    this.rStep=gl.getUniformLocation(this.pRay,'u_stepM');
    this.rRatio=gl.getUniformLocation(this.pRay,'u_ratio');
    this.rSteps=gl.getUniformLocation(this.pRay,'u_steps');
    this.rNight=gl.getUniformLocation(this.pRay,'u_night');
    this.rBias=gl.getUniformLocation(this.pRay,'u_bias');
    this.rPx=gl.getUniformLocation(this.pRay,'u_atlasPx');

    this.buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);

    /* atlas FBO */
    this.atlasTex=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,this.atlasTex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,ATLAS,ATLAS,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    this.fbo=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,this.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,this.atlasTex,0);
    var st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    L('B. shaders ok, FBO '+(st===gl.FRAMEBUFFER_COMPLETE?'complete ✓':'INCOMPLETE '+st));
  },

  wanted:function(){
    var b=map.getBounds(), pad=1;   /* one tile of margin so rays can leave the view */
    function xt(lon,n){ return Math.floor((lon+180)/360*n); }
    function yt(lat,n){ var r=lat*RAD; return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n); }
    /* Pick the HIGHEST DEM zoom whose tile count fits the budget, dropping a level at a
       time. Never truncate the list: a partial atlas silently loses shadow casters. */
    var z=Math.min(DEM_Z_MAX,Math.max(0,Math.floor(map.getZoom())));
    for(;;){
      var n=Math.pow(2,z);
      var x0=xt(b.getWest(),n)-pad,  x1=xt(b.getEast(),n)+pad;
      var y0=yt(b.getNorth(),n)-pad, y1=yt(b.getSouth(),n)+pad;
      if(z===0 || (x1-x0+1)*(y1-y0+1)<=TILE_BUDGET){
        var out=[];
        for(var x=x0;x<=x1;x++) for(var y=y0;y<=y1;y++){
          if(x<0||y<0||x>=n||y>=n) continue;
          out.push({z:z,x:x,y:y,n:n});
        }
        return out;
      }
      z--;
    }
  },

  /* LRU: drop the least-recently-used textures once the cache exceeds its cap.
     Tiles used by the current frame are never evicted. */
  evict:function(gl,keep){
    var keys=Object.keys(this.tiles), self=this;
    if(keys.length<=TILE_CACHE_MAX) return;
    keys.sort(function(a,b){ return (self.tiles[a].used||0)-(self.tiles[b].used||0); });
    var live=keys.length;
    for(var i=0;i<keys.length && live>TILE_CACHE_MAX;i++){
      var k=keys[i]; if(keep[k]) continue;
      if(this.tiles[k].tex) gl.deleteTexture(this.tiles[k].tex);
      delete this.tiles[k]; live--;
    }
  },

  load:function(gl,t){
    var key=t.z+'/'+t.x+'/'+t.y, self=this;
    if(this.tiles[key]){ this.tiles[key].used=++this.clock; return this.tiles[key]; }
    var rec={tex:null,ready:false,used:++this.clock}; this.tiles[key]=rec;
    var img=new Image(); img.crossOrigin='anonymous';
    img.onload=function(){
      var tex=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      rec.tex=tex; rec.ready=true;
      if(!self._first){ self._first=true; L('D. first tile in atlas ✓'); }
      map.triggerRepaint();
    };
    img.onerror=function(){ if(!self._terr){ self._terr=true; L('✗ tile failed (CORS/network): '+key); } };
    img.src=TERRARIUM+key+'.png';
    return rec;
  },

  render:function(gl,args){
    if(!this._enter){ this._enter=true; L('R1. render() called ✓'); }
    var matrix=args;
    if(args && !args.length)
      matrix=(args.defaultProjectionData&&args.defaultProjectionData.mainMatrix)||args.mainMatrix||args.matrix;
    if(!matrix||!matrix.length){
      if(!this._noMat){ this._noMat=true; L('✗ R2. no usable matrix; args keys: '+Object.keys(args||{}).join(',')); }
      return;
    }
    if(!this._gotMat){ this._gotMat=true; L('R2. matrix ok ✓'); }

    var list=this.wanted();
    if(!this._gotList){ this._gotList=true; L('R3. tiles wanted: '+list.length+(list.length?(' at z'+list[0].z):'')); }
    if(!list.length) return;
    var n=list[0].n;

    /* atlas rect = bounding box of the tiles we have, in mercator */
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(var i=0;i<list.length;i++){
      x0=Math.min(x0,list[i].x/n); x1=Math.max(x1,(list[i].x+1)/n);
      y0=Math.min(y0,list[i].y/n); y1=Math.max(y1,(list[i].y+1)/n);
    }
    var aw=x1-x0, ah=y1-y0;

    /* ---------- PASS 1: tiles -> atlas ---------- */
    gl.bindFramebuffer(gl.FRAMEBUFFER,this.fbo);
    gl.viewport(0,0,ATLAS,ATLAS);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.BLEND);
    gl.useProgram(this.pCopy);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
    gl.enableVertexAttribArray(this.cPos);
    gl.vertexAttribPointer(this.cPos,2,gl.FLOAT,false,0,0);
    gl.uniform4f(this.cAtlas,x0,y0,aw,ah);
    var drawn=0, keep={};
    for(var j=0;j<list.length;j++){
      var t=list[j], rec=this.load(gl,t);
      keep[t.z+'/'+t.x+'/'+t.y]=1;
      if(!rec.ready) continue;
      gl.uniform4f(this.cTile,t.x/n,t.y/n,1/n,1/n);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,rec.tex);
      gl.uniform1i(this.cTex,0);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      drawn++;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    this.evict(gl,keep);
    if(!drawn) return;

    /* ---------- PASS 2: raymarch ---------- */
    var c=map.getCenter();
    var s=sunAltAz(BASE+offsetMin*60000, c.lat, c.lng);
    /* mercator y grows southward, so north is -y */
    var azr=s.az*RAD;
    var sunx=Math.sin(azr), suny=-Math.cos(azr);
    var mPerMerc=40075016.686*Math.cos(c.lat*RAD);
    /* March distance: bounded by what the atlas covers AND by what the sun geometry can
       actually produce — the longest possible shadow is MAX_TERRAIN_H/tan(alt). At a high
       sun that is a few hundred metres, so a fixed long march was mostly wasted steps. */
    var atlasM=Math.max(aw,ah)*mPerMerc;
    var tanAlt=Math.tan(Math.max(s.alt,0.05)*RAD);
    var marchM=Math.min(MARCH_MAX,
                        Math.max(aw,ah)*mPerMerc*MARCH_FRAC,
                        MAX_TERRAIN_H/tanAlt);
    marchM=Math.max(MARCH_MIN,marchM);
    /* Step must not exceed the atlas texel, or the ray walks straight over ridges and
       leaves thin speckled streaks aligned with the sun azimuth. */
    var texelM=atlasM/ATLAS;
    var step0=texelM*STEP_TEXELS;
    var steps=Math.min(STEPS_MAX,Math.max(STEPS_MIN,Math.ceil(marchM/step0)));
    var ratio=1.0;
    if(step0*steps>=marchM){
      step0=marchM/steps;              /* uniform stepping reaches: unchanged v7 behaviour */
    }else{
      /* Solve step0*(r^n - 1)/(r - 1) = marchM for the growth ratio r. */
      var lo=1.0, hi=1.5;
      for(var k=0;k<40;k++){
        var mid=(lo+hi)*0.5;
        if(step0*(Math.pow(mid,steps)-1)/(mid-1)<marchM) lo=mid; else hi=mid;
      }
      ratio=(lo+hi)*0.5;
    }

    var cv=gl.canvas;
    gl.viewport(0,0,cv.width,cv.height);
    gl.useProgram(this.pRay);
    gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);
    gl.enableVertexAttribArray(this.rPos);
    gl.vertexAttribPointer(this.rPos,2,gl.FLOAT,false,0,0);
    gl.uniformMatrix4fv(this.rMatrix,false,matrix);
    gl.uniform4f(this.rAtlas,x0,y0,aw,ah);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,this.atlasTex);
    gl.uniform1i(this.rDem,0);
    gl.uniform2f(this.rSun,sunx,suny);
    gl.uniform1f(this.rTan,tanAlt);
    gl.uniform1f(this.rMpm,mPerMerc);
    gl.uniform2f(this.rSize,aw,ah);
    gl.uniform1f(this.rStep,step0);
    gl.uniform1f(this.rRatio,ratio);
    gl.uniform1f(this.rSteps,steps);
    gl.uniform1f(this.rBias,BIAS_M);
    gl.uniform2f(this.rPx,ATLAS,ATLAS);
    gl.uniform1f(this.rNight,s.alt<=0?1:0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

    if(!this._rep){ this._rep=true; L('E. raymarch running — '+drawn+' tiles in atlas @z'+list[0].z+
        ', march '+(marchM/1000).toFixed(1)+' km'); }
    document.getElementById('tl').textContent=
      new Date(BASE+offsetMin*60000).toISOString().replace('T',' ').slice(0,19)+
      ' UTC   sun alt '+s.alt.toFixed(1)+'°  az '+s.az.toFixed(1)+'°'+
      '   z'+list[0].z+'  '+drawn+'/'+list.length+' tiles  '+
      (marchM/1000).toFixed(2)+' km / '+steps+' steps, first '+step0.toFixed(0)+'m'+
      ' x'+ratio.toFixed(3)+' (texel '+texelM.toFixed(0)+'m)';
  }
};

map.on('load',function(){
  L('C. adding raymarch layer');
  map.addLayer(layer);
});
document.getElementById('t').addEventListener('input',function(e){
  offsetMin=parseInt(e.target.value,10); map.triggerRepaint();
});
</script>
