<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe2</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<style>
  #log{position:fixed;top:0;left:0;right:0;z-index:99;font:14px/1.5 monospace;white-space:pre-wrap;
       padding:10px;color:#0f0;background:rgba(0,0,0,.8)}
  #c{position:fixed;inset:0}
</style>
<div id="c"></div>
<div id="log">probe2 tracing…
</div>
<script>
  var log = document.getElementById('log');
  function L(m){ log.textContent += m + "\n"; }
  window.onerror = function(m,src,ln){ L('✗ window.onerror: ' + m + ' @' + ln); };
  window.addEventListener('unhandledrejection', function(e){ L('✗ rejection: ' + (e.reason && (e.reason.message||e.reason))); });

  var TOKEN='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyNmQyYmQwMC03Nzk3LTQwYjUtODVjNC04Y2U3ZDVjMTNjODAiLCJpZCI6NDU2OTAzLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODQxNTg5ODR9.ax7uLUdH61cKXQuE1GYSRtYnC2pLQI4YIPXpEev-6Xw';
  var LAT=41.9851, LON=-3.4186;

  try {
    L('A. setting token'); Cesium.Ion.defaultAccessToken = TOKEN;
    L('B. creating viewer…');
    var viewer = new Cesium.Viewer('c', { baseLayerPicker:false, geocoder:false, homeButton:false,
      sceneModePicker:false, navigationHelpButton:false, infoBox:false, selectionIndicator:false,
      timeline:false, animation:false });
    L('C. viewer created ✓');
    L('D. attaching world terrain…');
    var terrain = Cesium.Terrain.fromWorldTerrain();
    terrain.errorEvent.addEventListener(function(err){ L('✗ terrain errorEvent: ' + (err && (err.message||err))); });
    terrain.readyEvent.addEventListener(function(provider){
      L('E. terrain readyEvent FIRED ✓');
      L('F. sampling 1 point (level 12)…');
      Cesium.sampleTerrain(provider, 12, [Cesium.Cartographic.fromDegrees(LON, LAT)])
        .then(function(r){ L('G. sample OK ✓  height = ' + r[0].height.toFixed(1) + ' m'); })
        .catch(function(e){ L('✗ sampleTerrain failed: ' + (e.message||e)); });
    });
    viewer.scene.setTerrain(terrain);
    L('D2. setTerrain called; waiting for readyEvent…');
  } catch(e){ L('✗ THREW: ' + (e.message||e)); }

  setTimeout(function(){ L('— 10s mark — last line above = where it stalled —'); }, 10000);
</script>
