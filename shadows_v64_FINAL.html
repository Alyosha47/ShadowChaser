<script>
/* ============================================================================
   TERRAIN SHADOWS — GPU, no API key, no dependency.

   A pixel is in shadow iff some point up-sun is high enough to block the sun:
   marching distance s along the sun direction, pixel i is blocked iff any j has
   h_j > h_i + (s_j - s_i)*tan(alt). Rather than a running-max scan (the pre-v50
   rotate/re-grid pipeline, removed — it caused every re-gridding artefact:
   staircase coasts, streak combs, mask wisps), v50+ marches each screen pixel
   toward the sun per-pixel at screen resolution.

     PASS 1  DEM tiles          -> NEAR atlas (fine, viewport x NEAR_MULT) +
                                    FAR atlas (coarse, whole shadow reach)
                                    [bilinear on decoded metres]
     PASS 2  far atlas          -> max height    (reduction, sizes the next frame)
             each atlas         -> 4x/16x/64x block-max mip chain (buildMips)
     PASS 3  per-pixel RAY MARCH at screen resolution: near atlas while inside
             it, far beyond, step growing 3%/sample. Both atlases run the same
             hierarchical prune-then-resolve rule (glslStep): a block-max level
             may only PROVE a span clear and skip it; casters are always resolved
             at full bilinear resolution. This is the shademap-class design: no
             rotated re-grid, no global g field, no water display mask — shadows
             cross water and boundaries are DEM-sharp.

   VERIFIED: against closed-form geometry (self-test checkbox), and against an
   independent per-pixel march over the same atlas (CPU harness). Both agree to
   one texel; the harness reports 0 structural misses and 0 false positives.

   v43 — CURVED EARTH, SEPARABLY. On a sphere two things break the flat model at
   low sun: the Earth bulges by ds^2/(2R) between caster and receiver, and the
   sun's altitude rises by ds/R as you move toward it. Write both out:

     h_j - ds^2/(2R) > h_i + ds*tan(alt_i),   alt_i = alt0 + s_i/R
     => (using ds*s_i + ds^2/2 = (s_j^2 - s_i^2)/2, exact)
     h_j - s_j*tan(alt0) - s_j^2/(2R)  >  h_i - s_i*tan(alt0) - s_i^2/(2R)

   The blocked test becomes  h(s) - s*tanA - s^2/(2R) > h0, with tanA the
   receiver-local apparent altitude. This removes the one-sun-vector altitude
   error (each pixel evaluates its own solar altitude from the subsolar point),
   caps shadow reach at the grazing horizon sqrt(2*R*h) instead of infinity,
   and — with Saemundsson refraction added to alt — carries shadows to visible
   sunset. Residuals left out, both sub-texel here: sec^2(alt) factor on the
   gradient term (<1% below 6 deg) and terrestrial ray bending (~9 m at 30 km).

   v58 — FINE CASTERS. Membership in the near rect (not stride) now selects the
   atlas, so casters up to 1-20 km up-sun are resolved at the near texel, giving
   dendritic ridge silhouettes instead of far-atlas blobs. See glslStep and the
   HANDOFF_shadows_v58 section 5.
   ========================================================================== */

var VERSION='v64';

var TERRARIUM='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/';
var TILE_PX=256;                 /* nominal; the real size is read from each image */
var DEM_Z_MAX=13;
var TILE_BUDGET=window.matchMedia('(min-width: 900px)').matches ? 160 : 30;
var TILE_CACHE_MAX=380;   /* v57: room for the near-field budget; see NEAR-FIELD ACCURACY note */
var ATLAS_MIN=1024;
/* Texel size was believed the only lever left on BUG B; v43 adds three targeted ones
   (soft shadow edge, perpendicular swath max in pass 3, water mask from the DEM's own
   bathymetry sign) — see those sites. The measurement below still stands and larger
   atlases still help. MEASURED on a v39 screenshot: the shadow
   boundary steps 1-3 screen px (90th pct 2.2 texels) and the streak comb has a 1.5-2.9
   texel pitch, so both artefacts scale with the texel, not with anything in the maths.
   The residual error against a brute-force march is ~2%, almost all false negatives, and
   no sampler or scan change beat it: footprint max cost 19%, matched operators 9%, and
   the rotated spacing k only reaches 1.82% at its floor of 1.0.
   Doubling the cap halves the texel, hence halves both artefacts. Costs 3 x px^2 x 4
   bytes across atlas plus ping and pong, so it is desktop only and still clamped by
   MAX_TEXTURE_SIZE below. Drop back to 2048 if memory bites. */
var ATLAS_MAX=window.matchMedia('(min-width: 1200px)').matches ? 4096
             :window.matchMedia('(min-width: 900px)').matches ? 2048 : 1024;
var MARGIN_FRAC=0.12;            /* atlas overhang beyond the viewport, each side */
var DEM_RATIO=1.0;               /* DEM sample size / atlas texel; 1 = matched */
var MAX_TERRAIN_H=9000;          /* ceiling only; the real max is measured each frame */
var H_STEP=250;                  /* quantise it, or the atlas chases its own contents */
var MARCH_STEPS=300;             /* per-pixel ray samples (early-out when deep) */
var MARCH_GROW=0.03;             /* step growth per sample; 0 in self-test */
/* NEAR-CASTER GATE (v59 fix). The near branch resolves fine casters at UNIT
   near-texel; at grazing sun rayH stays ~h0 for tens of km, so the near mips
   can't prune and stepN resolves at 38 m over and over. Left unbounded that
   burns the whole step budget a few km up-sun, and the DISTANT caster that
   throws the long sunset shadow is never reached — long shadows vanish (v58/
   early v59 bug). So the near branch only runs for the first NEAR_CASTER_M of
   ray; beyond it the FAR branch takes over exactly as in v57 (its stride grows,
   crossing 198 km in ~140 steps), which is what preserves long shadows. The
   window still covers the casters that visibly shape a shadow's edge; casters
   farther up-sun soften below a pixel anyway (the LOD trade already documented).
   Budget: ~140 steps for the far march leaves ~150 for near; at 38 m unit stride
   that is ~5.7 km, so 5000 m is safe with margin. Tunable: raise for more near
   detail if the step budget allows, lower if grazing-sun shadows still truncate. */
var NEAR_CASTER_M=8000;
/* v64: crispness. Native-resolution casters (near atlas) now extend 8 km up-sun,
   not 5. Measured on the real Loch Broom DEM (harness): native 12 m casters give
   1.31x the shadow-edge detail of the 200 m far atlas, and the far atlas was
   OVER-shadowing (85% vs the exact 79%) - the blob-bleeding/melding you saw.
   8 km is the measured-safe max at grazing sun: step-budget sim p99=296 of 300,
   zero cap-hits (10 km+ truncates long shadows, the v58 bug). Improves #1 (ridges
   smoothed), #2 (promontories not unifying), and #3 (Carn nan Sgeir timing).
   PHONE REVERT: 5000 if grazing frames stutter. To go wider, raise MARCH_STEPS. */
/* NEAR-FIELD ACCURACY (v57). shademap's visible sharpness advantage is not
   physics or better source data (same ~30 m SRTM/NASADEM lineage) — it is
   resolution spent on the near field. These two lines buy roughly one extra
   near-zoom level: a tighter span and a bigger tile budget let zN rise, so
   texN drops from ~36 m toward ~15-18 m at typical zooms.
   COST: ~2x near-tile count, ~2x tile-cache pressure (DEM+OSM siblings,
   ~0.5 MB per tile pair). Fine on desktop.
   >>> OPUS: IF THIS CAUSES MEMORY PRESSURE / CRASHES ON PHONES, REVERT TO
   >>> THE PREVIOUS VALUES:  NEAR_MULT=1.6;  NEAR_BUDGET=90;  TILE_CACHE_MAX=300;
   (Nothing else depends on these; the march adapts automatically.) */
var NEAR_MULT=1.2;               /* near-atlas span = viewport span x this */
var NEAR_BUDGET=170;             /* tile cap for the near atlas */
var FAR_MIPS=['coarse1','coarse2','coarse3'];   /* 4x/16x/64x block max, far  */
var NEAR_MIPS=['nearC1','nearC2','nearC3'];     /* 4x/16x/64x block max, near */
var SHADOW_RGBA=[0.02,0.05,0.16,0.55];
var R_EARTH=6371000;             /* geometric radius; drives the g quadratic term */
/* WATER MASK, two signals, max wins.
   1. DEM: raw value below WATER_MAX_M. Works on open sea (verified -3.9..-2060 m).
      MEASURED DEAD for the sea lochs (v44 elevation instrument, 2026-07-24): Loch
      Broom and Little Loch Broom hold POSITIVE Terrarium values — "full of land" —
      so no height threshold can separate loch water from low coastal land. Do not
      re-chase. Kept only as fallback where an OSM tile fails to load.
   2. OSM: the basemap raster itself. The mask must match the MAP, not the DEM —
      shadows should stop exactly where the displayed water begins. Same tile URLs
      as the basemap, so the browser cache serves them: no extra network, same
      offline behaviour. osm-carto water is a constant #aad3df. v46: the 5x5
      neighbourhood is AREA-AVERAGED (not max-dilated): the stored value is the
      true water fraction of the cell, so the bilinear 50% contour lands on the
      real coastline to sub-texel accuracy instead of a dilated staircase, and
      label strokes or ferry dashes over water shift the fraction slightly
      instead of punching land-shaped holes.
   SEA vs RIVERS/LAKES (v47, MEASURED). Terrarium fills the fjords with phantom
   LAND up to ~190 m (decoded from the v46 elevation screenshot), so height alone
   cannot identify the sea; and spikes in ocean data (the hmax 3750 phantom) can
   cast counterfeit shadows tens of km. The rule, physical not heuristic:
   an OSM-water pixel whose 5x5 water fraction exceeds 0.5 is BROAD water; its
   surface is flat at its LOCAL WATER LEVEL = the 5x5 minimum height (a water
   pixel can never be a local spike). If that level is below SEA_MAX_M it is sea:
   height forced to 0 (fjord fill cannot cast) and the display mask applies.
   Above it, upland water: flattened to its level, keeps its shadow. Thin rivers
   fail the fraction gate and are untouched. Cost: freshwater below 200 m
   elevation is treated as sea (Loch Achall etc.) — the measured price of the
   fill. */
var WATER_MAX_M=0.5;
var SEA_MAX_M=200.0;
var OSM_WATER=[0.667,0.827,0.875];   /* #aad3df */
var OSM_TOL=0.10;

/* Saemundsson: refraction in arcmin for TRUE altitude h (deg). ~0.48 deg at the
   horizon. Shadows are cast by the APPARENT sun, so this is what the last-light
   look needs; without it everything blinks off ~half a degree early. */
function refracted(h){
  if(h<-2) return h;
  return h + 1.02/Math.tan((h+10.3/(h+5.11))*RAD)/60;
}

var TEST_H=500.0;                /* self-test cylinders: height in metres */
var TEST_R_FRAC=1/64;            /* radius as a fraction of the VIEWPORT */
var TEST_OFF=[[-0.25,-0.25],[0.25,-0.25],[-0.25,0.25],[0.25,0.25]];

var LAT0=57.9200, LON0=-5.2000;
var BASE=Date.parse('2026-08-12T18:28:41Z');
var offsetMin=0;

var log=document.getElementById('log');
function L(m){
  log.textContent += m+"\n";
  if(m.indexOf('\u2717')>=0) log.classList.add('on');   /* surface failures unasked */
}
window.onerror=function(m,s,ln){ L('\u2717 '+m+' @'+ln); };

var RAD=Math.PI/180;

/* Mercator is undefined past ~85.05 deg, and getBounds reports 90 when zoomed out.
   Unclamped, the projection explodes and every quantity derived from it goes with it. */
var MERC_MAX=85.05112878;
function mx(lon){ return (lon+180)/360; }
function my(lat){
  var r=Math.max(-MERC_MAX,Math.min(MERC_MAX,lat))*RAD;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2;
}
function latFromMercY(y){ return Math.atan(Math.sinh(Math.PI*(1-2*y)))/RAD; }

/* verified solar position (matches the app's computeEclipse to ~0.2 deg, and
   shademap's published altitude/azimuth to 0.1 deg) */
function sunAltAz(ms,lat,lon){
  var n=ms/86400000+2440587.5-2451545.0;
  var Lo=(((280.460+0.9856474*n)%360)+360)%360, g=((((357.528+0.9856003*n)%360)+360)%360)*RAD;
  var lam=(Lo+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*n)*RAD;
  var al=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), de=Math.asin(Math.sin(eps)*Math.sin(lam));
  var gmst=((((280.46061837+360.98564736629*n)%360))+360)%360, ha=(gmst+lon)*RAD-al, la=lat*RAD;
  var alt=Math.asin(Math.sin(la)*Math.sin(de)+Math.cos(la)*Math.cos(de)*Math.cos(ha));
  var az=Math.atan2(-Math.sin(ha),Math.tan(de)*Math.cos(la)-Math.sin(la)*Math.cos(ha));
  return { alt:alt/RAD, az:((az/RAD)+360)%360 };
}

/* Subsolar point (declination + longitude where the sun is overhead): the
   shader computes each pixel's TRUE spherical solar altitude from it — exact at
   every zoom, where the v52 linearisation drew a straight terminator. */
function sunSub(ms){
  var n=ms/86400000+2440587.5-2451545.0;
  var Lo=(((280.460+0.9856474*n)%360)+360)%360, g=((((357.528+0.9856003*n)%360)+360)%360)*RAD;
  var lam=(Lo+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*n)*RAD;
  var al=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), de=Math.asin(Math.sin(eps)*Math.sin(lam));
  var gmst=((((280.46061837+360.98564736629*n)%360))+360)%360;
  return { de:de, lon:al-gmst*RAD };
}

var map=new maplibregl.Map({
  container:'map',
  style:{version:8,
    sources:{ osm:{ type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                    tileSize:256, attribution:'\u00a9 OpenStreetMap' } },
    layers:[{id:'osm',type:'raster',source:'osm'}]},
  center:[LON0,LAT0], zoom:11
});
L('A. map created');

/* ---------------------------------------------------------------- GL helpers */
function compile(gl,type,src,tag){
  var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) L('\u2717 '+tag+': '+gl.getShaderInfoLog(s));
  return s;
}
function link(gl,vs,fs,tag){
  var p=gl.createProgram(); gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) L('\u2717 link '+tag+': '+gl.getProgramInfoLog(p));
  return p;
}
function target(gl,size){
  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,size,size,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  /* NEAREST throughout: every one of these textures holds ENCODED numbers, and linear
     filtering would blend the encoding rather than the value. Interpolation, where it
     is wanted, is done in-shader on decoded metres. */
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  var fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  var ok=gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {tex:tex,fbo:fbo,ok:ok,size:size};
}

/* -------------------------------------------------------------- GLSL fragments */
var QUAD_VS='attribute vec2 a_pos; void main(){ gl_Position=vec4(a_pos*2.0-1.0,0.0,1.0); }';

/* Terrarium: metres = r*256 + g + b/256 - 32768, negative over ocean (bathymetry).
   The sea SURFACE is flat whatever lies beneath, so heights clamp at zero. */
var GLSL_H=
  'float decodeH(vec4 c){'+
  '  return max((c.r*255.0*256.0 + c.g*255.0 + c.b*255.0/256.0) - 32768.0, 0.0); }'+
  'vec4 encodeH(float h){'+
  '  float v=h+32768.0, r=floor(v/256.0), g=floor(v-r*256.0);'+
  '  return vec4(r/255.0, g/255.0, floor((v-r*256.0-g)*256.0)/255.0, 1.0); }';

/* g is packed into 24 bits of RGB, keeping the no-float-extension, mobile-safe
   property the DEM encoding already had. Round-trips to 1.3e-7 of full range. */
/* Terrain is point samples, not flat blocks. Interpolating on DECODED metres keeps
   every texel from being a square plateau casting a square-edged shadow. */
function glslBilinear(name,sampler){
  return 'float '+name+'(vec2 uv, vec2 px){'+
    '  vec2 t=uv*px-0.5, f=fract(t), b=(floor(t)+0.5)/px, e=1.0/px;'+
    '  float a00=decodeH(texture2D('+sampler+',b));'+
    '  float a10=decodeH(texture2D('+sampler+',b+vec2(e.x,0.0)));'+
    '  float a01=decodeH(texture2D('+sampler+',b+vec2(0.0,e.y)));'+
    '  float a11=decodeH(texture2D('+sampler+',b+e));'+
    '  return mix(mix(a00,a10,f.x),mix(a01,a11,f.x),f.y); }';
}

/* ONE HIERARCHICAL STEP over one atlas (v58). Until v57 this rule existed only
   for the FAR atlas: the near atlas was consulted only while the stride still
   equalled one near texel, so every caster past ~33 near texels (~430 m of ray)
   was read from the far atlas and its ridges were smoothed away. That coarse
   caster side - not the data, not the physics - was the whole silhouette gap
   against shademap. The near-only-at-unit-stride rule was right; the fix is to
   give the near atlas the same prune-then-resolve machinery, not to relax it.

   Generated per atlas exactly as glslBilinear is: GLSL ES 1.00 cannot index
   samplers, and passing them as parameters would still need one call site each,
   so a generator keeps ONE structure instead of two hand-copied branches.

   INVARIANTS (each was a shipped bug - see HANDOFF section 2.5-2.7):
     - max levels PRUNE ONLY; h is never taken from one, only `hm<=rayH` -> skip
     - max levels are POINT-sampled; bilinear on a max undershoots between block
       centres and beads
     - a proven-clear skip advances to the tested cell's DDA exit, never a fixed
       width */
function glslStep(name,hfun,m1,m2,m3){
  return 'void '+name+'(vec2 q, float s, float rayH, float t, out float h, out float st){'+
    '  float str=max(t,s*u_grow);'+
    '  if(str<=t*1.001){ h='+hfun+'(q,u_px); st=t; return; }'+
    '  float C=(str<=4.0*t)?4.0:((str<=16.0*t)?16.0:64.0);'+
    '  float hm=(C==4.0)?decodeH(texture2D('+m1+',q))'+
    '          :((C==16.0)?decodeH(texture2D('+m2+',q)):decodeH(texture2D('+m3+',q)));'+
    '  if(hm<=rayH){ h=-1e9; st=ddaExit(q*u_px,C,0.06*C)*t; return; }'+
    /* one cheaper level is worth a probe before paying for a full-res sample */
    '  if(C>4.0 && decodeH(texture2D('+m1+',q))<=rayH){'+
    '    h=-1e9; st=ddaExit(q*u_px,4.0,0.24)*t; return; }'+
    '  h='+hfun+'(q,u_px); st=t; }';
}

/* ------------------------------------------------------------------- the layer */
var layer={
  id:'shadow', type:'custom', renderingMode:'2d', tiles:{}, clock:0, px:0,
  terrainMax:MAX_TERRAIN_H,

  onAdd:function(m,gl){
    /* PASS 1 — tile into the atlas, resampled onto the atlas grid */
    var copyVS='attribute vec2 a_pos; varying vec2 v_uv; uniform vec4 u_tile, u_atlas;'+
      'void main(){ v_uv=a_pos;'+
      ' vec2 merc=u_tile.xy+a_pos*u_tile.zw;'+
      ' gl_Position=vec4(((merc-u_atlas.xy)/u_atlas.zw)*2.0-1.0,0.0,1.0); }';
    /* Height is the same per-tap-clamped bilinear as ever (the sea surface is a
       flat 0 whatever the bathymetry). The ALPHA channel carries a WATER FRACTION
       from the DEM's own raw values — no external mask. Classification is
       nonlinear, so each tap is classified FIRST and the 0/1 indicator is
       interpolated: v43 interpolated raw heights and one steep coastal tap
       (say 150 m) dragged the whole mix positive half a texel into the water,
       un-masking exactly the fringe the mask existed to hide.
       Alpha: 0 = no tile, 0.6 = water, 1 = land, ramp between = the coastline,
       anti-aliased. All existing a<0.5 coverage tests still hold. */
    var copyFS='precision highp float; varying vec2 v_uv;'+
      'uniform sampler2D u_tex, u_osm; uniform vec2 u_tpx; uniform float u_hasOsm;'+
      GLSL_H+
      'float decodeR(vec4 c){'+
      '  return (c.r*255.0*256.0 + c.g*255.0 + c.b*255.0/256.0) - 32768.0; }'+
      /* watery = the exact water fill OR any bluish pixel: everything osm-carto
         draws OVER water (sea labels, ferry dashes, soundings) is bluish, while
         every land colour (beige, greens, greys, road orange/red) has b<=r or
         b<g. Big glyphs defeated the 5x5 window (the phantom land under the
         Ullapool-Stornoway label); hue does not. */
      'float watery(vec3 c){'+
      '  float d=step(distance(c,vec3('+OSM_WATER.map(function(v){return v.toFixed(3);}).join(',')+')),'+OSM_TOL.toFixed(2)+');'+
      '  float b=step(c.r+0.02,c.b)*step(c.g,c.b+0.001)*step(0.3,c.b);'+
      '  return max(d,b); }'+
      'void main(){'+
      '  vec2 t=v_uv*u_tpx-0.5, f=fract(t), b=(floor(t)+0.5)/u_tpx, e=1.0/u_tpx;'+
      '  float r00=decodeR(texture2D(u_tex,b));'+
      '  float r10=decodeR(texture2D(u_tex,b+vec2(e.x,0.0)));'+
      '  float r01=decodeR(texture2D(u_tex,b+vec2(0.0,e.y)));'+
      '  float r11=decodeR(texture2D(u_tex,b+e));'+
      '  float h=mix(mix(max(r00,0.0),max(r10,0.0),f.x),'+
      '              mix(max(r01,0.0),max(r11,0.0),f.x),f.y);'+
      '  float W='+WATER_MAX_M.toFixed(2)+';'+
      '  float wf=mix(mix(step(r00,W),step(r10,W),f.x),'+
      '               mix(step(r01,W),step(r11,W),f.x),f.y);'+
      /* Broad-water rule (see constants block): fraction>0.5 => flat water at

    this.px=px;
    this.good=null; this.goodN=null;
    L('B2. atlases '+px+'\u00b2 x2 '+((this.atlas.ok&&this.near.ok)?'\u2713':'INCOMPLETE'));
  },

  /* Tiles covering a mercator rect. Longitude wraps, so a view spanning the
     antimeridian needs no special case; dx keeps the unwrapped position. */
  wanted:function(rect,z){
    var n=Math.pow(2,z), out=[];
    var x0=Math.floor(rect[0]*n), x1=Math.floor((rect[0]+rect[2])*n);
    var y0=Math.max(0,Math.floor(rect[1]*n)), y1=Math.min(n-1,Math.floor((rect[1]+rect[2])*n));
    for(var x=x0;x<=x1;x++) for(var y=y0;y<=y1;y++)
      out.push({z:z, x:((x%n)+n)%n, y:y, n:n, dx:x});
    return out;
  },
  tileCount:function(rect,z){
    var n=Math.pow(2,z);
    var nx=Math.floor((rect[0]+rect[2])*n)-Math.floor(rect[0]*n)+1;
    var y0=Math.max(0,Math.floor(rect[1]*n)), y1=Math.min(n-1,Math.floor((rect[1]+rect[2])*n));
    return nx*Math.max(y1-y0+1,0);
  },

  load:function(gl,t){
    var key=t.z+'/'+t.x+'/'+t.y, self=this;
    if(this.tiles[key]){ this.tiles[key].used=++this.clock; return this.tiles[key]; }
    var rec={tex:null,osm:null,ready:false,osmReady:false,size:TILE_PX,used:++this.clock};
    this.tiles[key]=rec;
    var img=new Image(); img.crossOrigin='anonymous';
    img.onload=function(){
      var prevTex=gl.getParameter(gl.TEXTURE_BINDING_2D);
      var tex=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
      /* These bytes are NUMBERS, not colour. By default WebGL lets the browser apply a
         colour profile on upload; one count of drift in red is a 256 m elevation error. */
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.BROWSER_DEFAULT_WEBGL);
      gl.bindTexture(gl.TEXTURE_2D,prevTex);
      rec.tex=tex; rec.ready=true; rec.size=img.width; rec.img=img;
      if(!self._first){ self._first=true; L('D. first tile ' + img.width + 'px \u2713'); }
      map.triggerRepaint();
    };
    img.onerror=function(){
      /* resolved with no data, or one dead tile freezes the atlas forever */
      rec.ready=true;
      if(!self._terr){ self._terr=true; L('\u2717 tile failed (CORS/network): '+key); }
      map.triggerRepaint();
    };
    img.src=TERRARIUM+key+'.png';
    /* The matching BASEMAP tile — the water-mask authority. Same URL family as the
       displayed basemap, so at the display zoom the browser cache serves it with no
       extra network. Raw bytes (colorspace conversion OFF) so #aad3df compares
       exactly. A failed tile resolves (osm=null): DEM fallback classification. */
    var om=new Image(); om.crossOrigin='anonymous';
    om.onload=function(){
      var prevTex=gl.getParameter(gl.TEXTURE_BINDING_2D);
      var tex=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,om);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.BROWSER_DEFAULT_WEBGL);
      gl.bindTexture(gl.TEXTURE_2D,prevTex);
      rec.osm=tex; rec.osmReady=true;
      map.triggerRepaint();
    };
    om.onerror=function(){ rec.osmReady=true; map.triggerRepaint(); };
    om.src='https://tile.openstreetmap.org/'+key+'.png';
    return rec;
  },

  evict:function(gl,keep){
    var keys=Object.keys(this.tiles), self=this;
    if(keys.length<=TILE_CACHE_MAX) return;
    keys.sort(function(a,b){ return (self.tiles[a].used||0)-(self.tiles[b].used||0); });
    var live=keys.length;
    for(var i=0;i<keys.length && live>TILE_CACHE_MAX;i++){
      var k=keys[i]; if(keep[k]) continue;
      if(this.tiles[k].tex) gl.deleteTexture(this.tiles[k].tex);
      if(this.tiles[k].osm) gl.deleteTexture(this.tiles[k].osm);
      delete this.tiles[k]; live--;
    }
  },

  /* Reduce the atlas to one texel holding its max height, read that single pixel back.
     On the GPU: an earlier main-thread version of this caused visible judder. */
  measureMax:function(gl){
    var src=this.atlas.tex;
    gl.useProgram(this.pRed);
    for(var i=0;i<this.red.length;i++){
      var t=this.red[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER,t.fbo);
      gl.viewport(0,0,t.out,t.out);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src);
      gl.uniform1i(this.dSrc,0);
      gl.uniform2f(this.dSrcPx,t.srcPx,t.srcPx);
      gl.uniform1f(this.dTaps,t.taps);
      this.quad(gl,this.dPos);
      src=t.tex;
    }
    var b=new Uint8Array(4);
    gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,b);
    var h=b[0]*256+b[1]+b[2]/256-32768;
    if(isFinite(h)&&h>=0){
      var q=Math.min(MAX_TERRAIN_H,Math.max(H_STEP,Math.ceil(h/H_STEP)*H_STEP));
      /* Rise immediately (safety); decay ONE step per rebuild. hmax -> reach ->
         atlas span -> demZ -> new tiles -> new hmax is a feedback loop, and at
         low sun it oscillates (the flicker when toggling views). One-way damping
         breaks the cycle without ever under-reaching. */
      this.terrainMax = q>=this.terrainMax ? q : Math.max(q,this.terrainMax-H_STEP);
    }
  },

  /* Tile -> atlas copy, shared by both atlases. */
  copyInto:function(gl,tgt,rect,list){
    var PX=this.px;
    gl.bindFramebuffer(gl.FRAMEBUFFER,tgt.fbo);
    gl.viewport(0,0,PX,PX);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.disable(gl.BLEND);
    gl.useProgram(this.pCopy);
    gl.uniform4f(this.cAtlas,rect[0],rect[1],rect[2],rect[2]);
    for(var k=0;k<list.length;k++){
      var t=list[k], r=this.tiles[t.z+'/'+t.x+'/'+t.y];
      if(!r||!r.ready||!r.tex) continue;
      var n=t.n;
      gl.uniform2f(this.cTpx,r.size,r.size);
      gl.uniform4f(this.cTile,t.dx/n,t.y/n,1/n,1/n);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,r.tex);
      gl.uniform1i(this.cTex,0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D,r.osm||r.tex);   /* dummy bind if no OSM */
      gl.uniform1i(this.cOsm,1);
      gl.uniform1f(this.cHasOsm,r.osm?1:0);
      this.quad(gl,this.cPos);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  },

  /* MAX-MIP CHAIN (v54; v58 runs it over EITHER atlas). 4x, 16x, 64x block-max
     levels. The march picks the level whose texel covers its stride, so the
     stride grows EXPONENTIALLY with distance yet can never step over a caster —
     any reach in ~180 samples. (v53's single 4x level capped the stride: step
     count grew linearly with reach, rays exhausted the budget at a common front
     — the creeping zigzag wall — and phase-aliased at the cap — the bead
     chains.) Each level is built from the one above, so the apron in maxFS
     compounds; that is conservative in the safe direction. */
  buildMips:function(gl,srcTex,keys){
    var PX=this.px, src=srcTex, self=this;
    gl.disable(gl.BLEND);
    gl.useProgram(this.pMax);
    keys.forEach(function(k,i){
      var out=PX/Math.pow(4,i+1);
      gl.bindFramebuffer(gl.FRAMEBUFFER,self[k].fbo);
      gl.viewport(0,0,out,out);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src);
      gl.uniform1i(self.mSrc,0);
      gl.uniform2f(self.mPx,out*4,out*4);
      self.quad(gl,self.mPos);
      src=self[k].tex;
    });
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  },

  status:function(txt){ document.getElementById('tl').textContent=VERSION+'  '+txt; },

  render:function(gl,args){
    /* An exception escaping into MapLibre's render loop aborts its per-frame
       state housekeeping — one class of corrupted-canvas failures. Contain and
       REPORT it: the on-page log names the line. */
    try{ this._render(gl,args); }
    catch(e){ if(!this._crashed){ this._crashed=true;
      L('\u2717 render threw: '+(e&&e.message?e.message:e)); } }
  },
  _render:function(gl,args){
    /* MapLibre v5 passes an options object, not a bare matrix array. */
    var matrix=args;
    if(args && !args.length)
      matrix=(args.defaultProjectionData&&args.defaultProjectionData.mainMatrix)||args.mainMatrix||args.matrix;
    if(!matrix||!matrix.length){
      if(!this._noMat){ this._noMat=true; L('\u2717 no usable matrix; keys: '+Object.keys(args||{}).join(',')); }
      return;
    }
    this.resize(gl);
    var PX=this.px;

    var bb=map.getBounds();
    var bx0=mx(bb.getWest()), bx1=mx(bb.getEast());
    if(bx1<bx0) bx1+=1;                      /* view crosses the antimeridian */
    var by0=my(bb.getNorth()), by1=my(bb.getSouth());
    var c=map.getCenter();
    var mPerMerc=40075016.686*Math.cos(c.lat*RAD);
    var s=sunAltAz(BASE+offsetMin*60000, c.lat, c.lng);
    var altApp=refracted(s.alt);        /* the APPARENT sun casts the shadows */
    var when=new Date(BASE+offsetMin*60000).toISOString().replace('T',' ').slice(0,19)+' UTC';
    var head=when+'  alt '+s.alt.toFixed(1)+'\u00b0 app '+altApp.toFixed(1)+
             '\u00b0 az '+s.az.toFixed(1)+'\u00b0';

    /* v52: no cutoff and no global fade — lighting is per pixel in the shader
       (local disc fraction), so the terminator sweeps the view and night is a
       persistent veil, not an absence of rendering. Night pixels early-out of
       the march in a few steps; the layer stays cheap after dark. */

    /* The computed area must hold every blocker that can reach the view, so its size
       follows from the SUN, not the zoom: the longest shadow is maxH/tan(alt). Sizing
       it to the viewport truncates every shadow longer than the screen — which at a
       low sun is all of them. Symmetric about the view, so scrubbing time does not
       move the grid; origin snapped to a texel, so panning translates it exactly. */
    var vSpan=Math.max(bx1-bx0,by1-by0)*(1+2*MARGIN_FRAC);
    /* Self-test placement only. vSpan is the LARGER viewport dimension plus margin, so
       on a portrait phone (H/W ~ 1.9) an offset of 0.25*vSpan is 0.60*W and the cylinders
       sit off the left and right edges while their shadows sweep back into view. Place
       and size them by the SMALLER dimension so they are on screen at any aspect. */
    var vTest=Math.min(bx1-bx0,by1-by0);
    var tanAlt=Math.tan(Math.max(altApp,0.05)*RAD);
    /* Longest shadow on a CURVED earth: solve h = L*tan(alt) + L^2/(2R).
       Reduces to h/tan at high sun; caps at the grazing horizon sqrt(2*R*h)
       (~126 km for 1250 m) instead of diverging — so texels stay usable at 0. */
    var reachM=R_EARTH*(Math.sqrt(tanAlt*tanAlt+2*this.terrainMax/R_EARTH)-tanAlt);
    /* Sun vector, needed by the gate below. Mercator y grows southward. */
    var azr=s.az*RAD;
    var ux=Math.sin(azr), uy=-Math.cos(azr);
    var a=Math.min(1.0, vSpan+2.0*reachM/mPerMerc);
    var texel=a/PX;
    var x0=Math.floor(((bx0+bx1)/2-a/2)/texel)*texel;
    var y0=Math.floor(((by0+by1)/2-a/2)/texel)*texel;
    var texelM=a*mPerMerc/PX;

    /* No view-width gate (v50): the march evaluates the receiver-local sun
       altitude per pixel, so the one-sun-vector error the gate policed no
       longer exists. Azimuth still uses the centre value; its variation across
       a viewport rotates shadows by well under a texel. */

    /* ---------- PASS 1: build the atlases ---------- */
    var synth=document.getElementById('test').checked;
    var demZ=0, zN=0, want=0, ready=0;
    if(synth){
      gl.bindFramebuffer(gl.FRAMEBUFFER,this.atlas.fbo);
      gl.viewport(0,0,PX,PX);
      gl.disable(gl.BLEND);
      gl.useProgram(this.pTest);
      gl.uniform2f(this.tPx,PX,PX);
      gl.uniform1f(this.tR,PX*TEST_R_FRAC*vTest/a);
      gl.uniform1f(this.tH,TEST_H);
      for(var oi=0;oi<4;oi++)
        gl.uniform2f(this.tO[oi],TEST_OFF[oi][0]*vTest/a,TEST_OFF[oi][1]*vTest/a);
      this.quad(gl,this.tPos);
      this.measureMax(gl);
      this.buildMips(gl,this.atlas.tex,FAR_MIPS);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      this.good={x0:x0,y0:y0,a:a};
      this.goodN=null;                       /* march falls back to far: exact test */
    } else {
      /* FAR atlas: the whole shadow reach at whatever z the budget allows. */
      demZ=Math.round(Math.log(mPerMerc/(TILE_PX*texelM*DEM_RATIO))/Math.LN2);
      demZ=Math.min(DEM_Z_MAX,Math.max(0,demZ));
      while(demZ>0 && this.tileCount([x0,y0,a],demZ)>TILE_BUDGET) demZ--;
      var list=this.wanted([x0,y0,a],demZ);
      if(!list.length) return;

      /* NEAR atlas: just the viewport (x NEAR_MULT) at the finest affordable z —
         this is where every boundary the eye inspects comes from. */
      var aN=Math.min(a, vSpan*NEAR_MULT);
      var texN=aN/PX;
      var xN=Math.floor(((bx0+bx1)/2-aN/2)/texN)*texN;
      var yN=Math.floor(((by0+by1)/2-aN/2)/texN)*texN;
      var texNM=aN*mPerMerc/PX;
      zN=Math.round(Math.log(mPerMerc/(TILE_PX*texNM*DEM_RATIO))/Math.LN2);
      zN=Math.min(DEM_Z_MAX,Math.max(demZ,zN));
      while(zN>demZ && this.tileCount([xN,yN,aN],zN)>NEAR_BUDGET) zN--;
      var listN=this.wanted([xN,yN,aN],zN);

      want=list.length+listN.length;
      var keep={}, readyF=0, readyN=0;
      for(var j=0;j<list.length;j++){
        var rec=this.load(gl,list[j]);
        keep[list[j].z+'/'+list[j].x+'/'+list[j].y]=1;
        if(rec.ready&&rec.osmReady) readyF++;
      }
      for(var j2=0;j2<listN.length;j2++){
        var rec2=this.load(gl,listN[j2]);
        keep[listN[j2].z+'/'+listN[j2].x+'/'+listN[j2].y]=1;
        if(rec2.ready&&rec2.osmReady) readyN++;
      }
      ready=readyF+readyN;
      this.evict(gl,keep);

      /* Each atlas rebuilds only when ITS tiles are complete; otherwise the last
         complete one keeps serving (correctly georeferenced, older area). */
      if(readyF===list.length || !this.good){
        if(readyF){
          this.copyInto(gl,this.atlas,[x0,y0,a],list);
          this.measureMax(gl);
          this.buildMips(gl,this.atlas.tex,FAR_MIPS);
          this.good={x0:x0,y0:y0,a:a};
          this.demZ=demZ;
        }
      }
      if(readyN===listN.length || !this.goodN){
        if(readyN){
          this.copyInto(gl,this.near,[xN,yN,aN],listN);
          this.buildMips(gl,this.near.tex,NEAR_MIPS);
          this.goodN={x0:xN,y0:yN,a:aN};
          this.zN=zN;
        }
      }
    }
    if(!this.good) return;
    x0=this.good.x0; y0=this.good.y0; a=this.good.a;
    texelM=a*mPerMerc/PX;
    /* The near branch samples u_dem0 with u_r0/u_t0 AND prunes against the near
       mips. All three must describe the SAME rect. If the near mips are absent
       (device < 8 texture units), fall the whole near branch back to the far
       atlas so it stays self-consistent — never near atlas + far mips, which
       would prune against the wrong texels and miss casters. */
    var useNear=this.goodN&&this.nearMips;
    var nearTex=useNear?this.near.tex:this.atlas.tex;
    var rN=useNear?this.goodN:this.good;
    var texNM2=rN.a*mPerMerc/PX;
    var edgeM=Math.max(0.5,0.75*texNM2*tanAlt);

    /* ---------- PASS 3: march ---------- */
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    gl.viewport(0,0,gl.canvas.width,gl.canvas.height);
    gl.useProgram(this.pShade);
    gl.uniformMatrix4fv(this.hMatrix,false,matrix);
    gl.uniform4f(this.hAtlasR,x0,y0,a,a);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,nearTex);
    gl.uniform1i(this.hD0,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,this.atlas.tex);
    gl.uniform1i(this.hD1,1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,this.coarse1.tex);
    gl.uniform1i(this.hC1,2);
    gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D,this.coarse2.tex);
    gl.uniform1i(this.hC2,3);
    gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D,this.coarse3.tex);
    gl.uniform1i(this.hC3,4);
    /* Near mips when the near branch is active; otherwise the far chain, which
       matches the far-atlas fallback bound to u_dem0 above. */
    var nm=useNear?NEAR_MIPS:FAR_MIPS;
    var nh=[this.hN1,this.hN2,this.hN3];
    for(var mi=0;mi<3;mi++){
      gl.activeTexture(gl.TEXTURE5+mi);
      gl.bindTexture(gl.TEXTURE_2D,this[nm[mi]].tex);
      gl.uniform1i(nh[mi],5+mi);
    }
    gl.uniform3f(this.hR0,rN.x0,rN.y0,rN.a);
    gl.uniform3f(this.hR1,x0,y0,a);
    var sub=sunSub(BASE+offsetMin*60000);
    gl.uniform1f(this.hSde,Math.sin(sub.de));
    gl.uniform1f(this.hCde,Math.cos(sub.de));
    gl.uniform1f(this.hSlon,sub.lon);
    gl.uniform2f(this.hPx,PX,PX);
    gl.uniform2f(this.hU,ux,uy);
    gl.uniform1f(this.hT0,texNM2);
    gl.uniform1f(this.hT1,texelM);
    gl.uniform1f(this.hMpm,mPerMerc);
    gl.uniform1f(this.hTanA,tanAlt);
    gl.uniform1f(this.hRE,R_EARTH);
    gl.uniform1f(this.hReach,reachM);
    gl.uniform1f(this.hGrow,synth?0.0:MARCH_GROW);
    gl.uniform1f(this.hNearMax,synth?1e9:NEAR_CASTER_M);
    gl.uniform1f(this.hEdge,edgeM);
    gl.uniform4f(this.hCol,SHADOW_RGBA[0],SHADOW_RGBA[1],SHADOW_RGBA[2],SHADOW_RGBA[3]);
    gl.uniform1f(this.hSynth,synth?1:0);
    gl.uniform1f(this.hElev,document.getElementById('elev').checked?1:0);
    gl.uniform1f(this.hR,PX*TEST_R_FRAC*vTest/a);
    gl.uniform1f(this.hH,TEST_H);
    for(var si=0;si<4;si++)
      gl.uniform2f(this.hS[si],TEST_OFF[si][0]*vTest/a,TEST_OFF[si][1]*vTest/a);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
    this.quad(gl,this.hPos);
    gl.activeTexture(gl.TEXTURE0);

    if(!this._ran){ this._ran=true; L('E. running \u2713'); }
    if(altApp<=-0.27) head+='  (night in view)';
    this.status(head+(synth?'  SELF-TEST: shadow should be '+(TEST_H/tanAlt/1000).toFixed(2)+
                             ' km toward az '+((s.az+180)%360).toFixed(0)+'\u00b0'
                            :'  zN'+(this.zN||0)+'/zF'+demZ+'  '+ready+'/'+want+' tiles')+
                '  texN '+(this.goodN?(this.goodN.a*mPerMerc/PX).toFixed(0):'-')+'m'+
                '  texF '+texelM.toFixed(0)+'m'+
                '  hmax '+this.terrainMax+'m  reach '+(reachM/1000).toFixed(1)+'km');
  }
};

map.on('load',function(){ L('C. adding layer'); map.addLayer(layer); });

/* PROBE. Reads one point two independent ways: straight out of Terrarium's PNG on the
   2D canvas (no GPU at all) and out of the atlas via readPixels. A disagreement in
   metres localises the fault; agreement clears the copy pass and moves it downstream.
   Opens the log FIRST and catches everything, so a failure reports itself. */
var probeCanvas=document.createElement('canvas');
function say(m){ L(m); try{ alert(m); }catch(e){} }
function probe(lng,lat){
  log.classList.add('on');
  try{
    var self=layer, gl=self.gl;
    if(!gl){ say('probe: layer has no gl yet'); return; }
    if(!self.good){ say('probe: no atlas built yet'); return; }
    var pmx=mx(lng), pmy=my(lat), g=self.good, PX=self.px;
    var fx=(pmx-g.x0)/g.a, fy=(pmy-g.y0)/g.a;
    var out='PROBE '+lat.toFixed(5)+','+lng.toFixed(5);
    if(fx<0||fx>1||fy<0||fy>1){ say(out+'  outside atlas ('+fx.toFixed(2)+','+fy.toFixed(2)+')'); return; }
    var tx=Math.min(PX-1,Math.floor(fx*PX)), ty=Math.min(PX-1,Math.floor(fy*PX));
    var pk=new Uint8Array(4);
    gl.bindFramebuffer(gl.FRAMEBUFFER,self.atlas.fbo);
    gl.readPixels(tx,ty,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pk);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);
    var raw=pk[0]*256+pk[1]+pk[2]/256-32768;
    out+='\n  atlas '+tx+','+ty+' rgba '+pk[0]+','+pk[1]+','+pk[2]+','+pk[3]+' = '+raw.toFixed(1)+'m';
    var z=self.demZ;
    if(z===undefined){ say(out+'\n  (self-test mode: no DEM to compare)'); return; }
    var n=Math.pow(2,z), gx=pmx*n, gy=pmy*n;
    var TX=Math.floor(gx), TY=Math.floor(gy);
    var key=z+'/'+(((TX%n)+n)%n)+'/'+TY, rec=self.tiles[key];
    out+='\n  tile '+key;
    if(!rec){ say(out+'  NOT IN CACHE'); return; }
    if(!rec.img){ say(out+'  no image (failed to load?)'); return; }
    var S=rec.img.width;
    probeCanvas.width=S; probeCanvas.height=S;
    var cx=probeCanvas.getContext('2d',{willReadFrequently:true});
    cx.clearRect(0,0,S,S); cx.drawImage(rec.img,0,0);
    var px_=Math.min(S-1,Math.floor((gx-TX)*S)), py_=Math.min(S-1,Math.floor((gy-TY)*S));
    var d=cx.getImageData(px_,py_,1,1).data;
    var terr=d[0]*256+d[1]+d[2]/256-32768;
    out+=' px '+px_+','+py_+' rgb '+d[0]+','+d[1]+','+d[2]+' = '+terr.toFixed(1)+'m';
    out+='\n  TERRARIUM '+Math.max(terr,0).toFixed(1)+'m   ATLAS '+raw.toFixed(1)+
         'm   DELTA '+(raw-Math.max(terr,0)).toFixed(1)+'m';
    say(out);
  }catch(e){ say('\u2717 probe threw: '+(e&&e.message?e.message:e)); }
}
map.on('click',function(ev){ probe(ev.lngLat.lng,ev.lngLat.lat); });

else say('\u2717 probe button missing: stale HTML is cached');

  offsetMin=parseInt(e.target.value,10); map.triggerRepaint();
});
