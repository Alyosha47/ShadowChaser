<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShadowLayer — integration example</title>
<link href="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.5.0/dist/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%}
  #map{position:absolute;inset:0}
  #panel{position:absolute;left:10px;bottom:10px;z-index:1;background:rgba(0,0,0,.7);
         color:#fff;font:13px system-ui;padding:10px 12px;border-radius:8px}
  #panel input[type=range]{width:240px;vertical-align:middle}
  #status{position:absolute;right:10px;bottom:10px;z-index:1;color:#fff;
          font:11px ui-monospace,monospace;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div id="clock">—</div>
  <input id="t" type="range" min="-720" max="720" value="0" step="2">
</div>
<div id="status"></div>

<!-- the module: exposes window.createShadowLayer -->
<script src="shadow-layer.js"></script>

<script>
  // 1) your app's own map + basemap (this is just an example basemap)
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: { osm: { type:'raster',
        tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
        tileSize:256, attribution:'© OpenStreetMap' } },
      layers: [{ id:'osm', type:'raster', source:'osm' }]
    },
    center: [-5.20, 57.92],   // Loch Broom / Ullapool
    zoom: 11
  });

  // 2) create the shadow layer for an instant, add it over the basemap
  const BASE = Date.parse('2026-08-12T18:28:41Z');
  const shadow = createShadowLayer({
    time: BASE,
    // shadowColor: [0.02,0.05,0.16,0.55],   // optional
    onStatus: txt => document.getElementById('status').textContent = txt
  });

  map.on('load', () => map.addLayer(shadow));   // add ABOVE the basemap

  // 3) drive time from your app (here: a slider of ±12h around BASE)
  const t = document.getElementById('t'), clock = document.getElementById('clock');
  function apply(){
    const ms = BASE + parseInt(t.value,10) * 60000;
    shadow.setTime(ms);                         // <-- the whole API you need
    clock.textContent = new Date(ms).toISOString().replace('T',' ').slice(0,16) + ' UTC';
  }
  t.addEventListener('input', apply);
  apply();
</script>
</body>
</html>
