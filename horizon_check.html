<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Horizon check — 2026-08-12 eclipse, Spain</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<style>
  html,body,#c{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}
  #hud{position:absolute;top:8px;left:8px;z-index:5;font:12px/1.5 monospace;color:#fff;
       background:rgba(0,0,0,.62);padding:9px 11px;border-radius:6px;max-width:74vw}
  #hud b{color:#ffd27a}
  #verdict{font-size:15px}
  .lit{color:#7CFC66} .blk{color:#ff6b6b}
  #err{position:absolute;top:8px;left:8px;right:8px;z-index:9;font:13px/1.5 monospace;color:#ffb4b4;
       background:#180a0a;border:1px solid #612;padding:12px;border-radius:8px;display:none;white-space:pre-wrap}
</style>
<div id="c"></div>
<div id="hud">loading…</div>
<div id="err"></div>
<script>
var ION_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyNmQyYmQwMC03Nzk3LTQwYjUtODVjNC04Y2U3ZDVjMTNjODAiLCJpZCI6NDU2OTAzLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODQxNTg5ODR9.ax7uLUdH61cKXQuE1GYSRtYnC2pLQI4YIPXpEev-6Xw';

var LAT = 41.9851, LON = -3.4186;
var MAX_UTC = '2026-08-12T18:28:41Z';
var R = 6371000, RAD = Math.PI/180;
var STEP = 150, MAXRANGE = 30000;   // march 150 m out to 30 km

var hud = document.getElementById('hud'), errBox = document.getElementById('err');
function fail(m){ errBox.style.display='block'; errBox.textContent=String(m); hud.style.display='none'; }
window.addEventListener('error', function(e){ fail('JS error: '+(e.message||e.error)); });
window.addEventListener('unhandledrejection', function(e){ fail('Promise rejected: '+(e.reason&&(e.reason.message||e.reason))); });

// --- verified solar position (matches the app's 7.8°/282.9°) ---
function sunAltAz(ms){
  var n = ms/86400000 + 2440587.5 - 2451545.0;
  var L=(((280.460+0.9856474*n)%360)+360)%360;
  var g=((((357.528+0.9856003*n)%360)+360)%360)*RAD;
  var lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD;
  var eps=(23.439-0.0000004*n)*RAD;
  var alpha=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  var delta=Math.asin(Math.sin(eps)*Math.sin(lam));
  var gmst=((((280.46061837+360.98564736629*n)%360))+360)%360;
  var ha=(gmst+LON)*RAD-alpha, lat=LAT*RAD;
  var alt=Math.asin(Math.sin(lat)*Math.sin(delta)+Math.cos(lat)*Math.cos(delta)*Math.cos(ha));
  var az=Math.atan2(-Math.sin(ha),Math.tan(delta)*Math.cos(lat)-Math.sin(lat)*Math.cos(ha));
  return { alt:alt/RAD, az:((az/RAD)+360)%360 };
}
// destination point given start, bearing(deg), distance(m) — spherical
function dest(latDeg,lonDeg,brgDeg,d){
  var lat1=latDeg*RAD, lon1=lonDeg*RAD, brg=brgDeg*RAD, dR=d/R;
  var lat2=Math.asin(Math.sin(lat1)*Math.cos(dR)+Math.cos(lat1)*Math.sin(dR)*Math.cos(brg));
  var lon2=lon1+Math.atan2(Math.sin(brg)*Math.sin(dR)*Math.cos(lat1),Math.cos(dR)-Math.sin(lat1)*Math.sin(lat2));
  return { lat:lat2/RAD, lon:lon2/RAD };
}
function nowMs(v){ return Cesium.JulianDate.toDate(v.clock.currentTime).getTime(); }

(function(){
  if (typeof Cesium==='undefined'){ fail('Cesium did not load.'); return; }
  Cesium.Ion.defaultAccessToken = ION_TOKEN;
  var viewer;
  try {
    viewer = new Cesium.Viewer('c',{ baseLayerPicker:false, geocoder:false, homeButton:false,
      sceneModePicker:false, navigationHelpButton:false, infoBox:false, selectionIndicator:false,
      timeline:true, animation:true });
  } catch(e){ fail('Viewer failed: '+(e.message||e)); return; }
  var scene = viewer.scene;
  scene.globe.enableLighting = false;

  var t = Cesium.JulianDate.fromIso8601(MAX_UTC);
  viewer.clock.currentTime = t.clone();
  viewer.clock.shouldAnimate = false;
  viewer.clock.multiplier = 120;
  viewer.timeline.zoomTo(Cesium.JulianDate.addMinutes(t,-90,new Cesium.JulianDate()),
                         Cesium.JulianDate.addMinutes(t, 90,new Cesium.JulianDate()));

  var terrain = Cesium.Terrain.fromWorldTerrain();
  terrain.errorEvent.addEventListener(function(err){ fail('Terrain failed: '+(err&&(err.message||err))); });
  terrain.readyEvent.addEventListener(function(provider){ hud.textContent='terrain ready — sampling ray…'; runCheck(provider); });
  scene.setTerrain(terrain);

  // Watchdog: terrain silently blocked (e.g. Brave Shields in a private window) fires
  // no error, so surface it instead of hanging on "loading…".
  setTimeout(function(){
    if (!profile && errBox.style.display==='none'){
      hud.innerHTML = '<b>terrain never loaded (' + (hud.textContent.indexOf('sampl')>=0?'sampling stage':'no ready event') + ')</b><br>' +
        'Likely the ion terrain request is blocked. Use a NORMAL window (not incognito),<br>' +
        'and drop Brave Shields for followtheshadow.com.';
    }
  }, 8000);

  var profile = null;          // { az, maxAngle, blocker:{d,h,lat,lon}, eyeH }
  function runCheck(provider){
    try {
      var azMax = sunAltAz(Date.parse(MAX_UTC)).az;
      var carts = [ Cesium.Cartographic.fromDegrees(LON, LAT) ];  // index 0 = observer
      var meta = [ { d:0, lat:LAT, lon:LON } ];
      for (var d=STEP; d<=MAXRANGE; d+=STEP){
        var p = dest(LAT, LON, azMax, d);
        carts.push(Cesium.Cartographic.fromDegrees(p.lon, p.lat));
        meta.push({ d:d, lat:p.lat, lon:p.lon });
      }
      hud.textContent = 'sampling '+carts.length+' terrain points…';
      // Fast: fixed-level sample (few tiles) instead of most-detailed (hundreds of tiles).
      Cesium.sampleTerrain(provider, 12, carts).then(function(res){
        try { finish(res, meta, azMax); }
        catch(e){ fail('compute/draw failed: '+(e.message||e)); }
      }).catch(function(e){
        // fall back to most-detailed if level 12 isn't available here
        hud.textContent = 'retrying (most-detailed)…';
        Cesium.sampleTerrainMostDetailed(provider, carts).then(function(res){
          try { finish(res, meta, azMax); } catch(e2){ fail('compute/draw failed: '+(e2.message||e2)); }
        }).catch(function(e2){ fail('terrain sampling failed: '+(e2.message||e2)); });
      });
    } catch(e){ fail('runCheck failed: '+(e.message||e)); }
  }

  function finish(res, meta, azMax){
    var eyeH = res[0].height + 1.7;
    var maxAngle = -90, bi = 0;
    for (var i=1;i<res.length;i++){
      if (res[i].height == null) continue;
      var d = meta[i].d, dz = res[i].height - eyeH - (d*d)/(2*R);
      var ang = Math.atan2(dz, d)/RAD;
      if (ang > maxAngle){ maxAngle = ang; bi = i; }
    }
    profile = { az:azMax, maxAngle:maxAngle, eyeH:eyeH,
                blocker:{ d:meta[bi].d, h:res[bi].height, lat:meta[bi].lat, lon:meta[bi].lon } };
    draw(res, meta, eyeH, azMax);
    viewer.clock.onTick.addEventListener(updateVerdict);
    updateVerdict();
  }

  function draw(res, meta, eyeH, az){
    var observer = Cesium.Cartesian3.fromDegrees(LON, LAT, eyeH);
    // yellow ground track along the ray
    var track = [];
    for (var i=0;i<meta.length;i+=2){ track.push(meta[i].lon, meta[i].lat); }
    viewer.entities.add({ polyline:{ positions:Cesium.Cartesian3.fromDegreesArray(track),
      width:2, clampToGround:true, material:Cesium.Color.YELLOW.withAlpha(0.7) } });
    // observer marker
    viewer.entities.add({ position:observer,
      point:{ pixelSize:11, color:Cesium.Color.CYAN, outlineColor:Cesium.Color.BLACK, outlineWidth:2 } });
    // GREEN sightline to the sun — tilts live with the clock via CallbackProperty
    viewer.entities.add({ polyline:{ width:3,
      positions:new Cesium.CallbackProperty(function(){
        var s = sunAltAz(nowMs(viewer));
        var end = dest(LAT, LON, az, MAXRANGE);
        var endH = eyeH + MAXRANGE*Math.tan(s.alt*RAD) - (MAXRANGE*MAXRANGE)/(2*R);
        return [ observer, Cesium.Cartesian3.fromDegrees(end.lon, end.lat, endH) ];
      }, false),
      material:new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(function(){
        var s = sunAltAz(nowMs(viewer));
        return (profile && s.alt > profile.maxAngle) ? Cesium.Color.LIME : Cesium.Color.RED;
      }, false)) } });
    // blocking-ridge marker
    viewer.entities.add({ position:Cesium.Cartesian3.fromDegrees(profile.blocker.lon, profile.blocker.lat, profile.blocker.h),
      point:{ pixelSize:10, color:Cesium.Color.ORANGE, outlineColor:Cesium.Color.BLACK, outlineWidth:2 } });
    // camera: sit behind the observer (opposite the sun), look along the ray toward the sun
    var cam = dest(LAT, LON, az+180, 5500);
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(cam.lon, cam.lat, res[0].height + 2600),
      orientation:{ heading:az*RAD, pitch:-10*RAD, roll:0 }
    });
  }

  function updateVerdict(){
    if (!profile) return;
    var s = sunAltAz(nowMs(viewer));
    var margin = s.alt - profile.maxAngle;
    var b = profile.blocker;
    // height of terrain blocker above the current sightline at its distance
    var sightH = profile.eyeH + b.d*Math.tan(s.alt*RAD) - (b.d*b.d)/(2*R);
    var above = b.h - sightH;
    var verdict, cls;
    if (s.alt <= 0){ verdict='SUN BELOW HORIZON'; cls='blk'; }
    else if (margin > 0){ verdict='SUNLIT ✓  margin +'+margin.toFixed(1)+'°'; cls='lit'; }
    else { verdict='BLOCKED ✗  by '+(-margin).toFixed(1)+'°'; cls='blk'; }
    hud.innerHTML =
      '<b>Horizon check · 2026-08-12 · Spain</b><br>' +
      'sun alt <b>'+s.alt.toFixed(1)+'°</b> az <b>'+s.az.toFixed(1)+'°</b> · ray az '+profile.az.toFixed(1)+'°<br>' +
      'skyline ridge angle <b>'+profile.maxAngle.toFixed(1)+'°</b> · '+(b.d/1000).toFixed(1)+' km out<br>' +
      'ridge is <b>'+(above>0?'+':'')+above.toFixed(0)+' m</b> vs your sightline<br>' +
      '<span id="verdict" class="'+cls+'">'+verdict+'</span><br>' +
      '<span style="opacity:.7">green line = clear · red = blocked · scrub to move the sun</span>';
    var v = document.getElementById('verdict'); if (v) v.className = cls;
  }
})();
