<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>horizon3 — 2026-08-12 Spain</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<style>
  #c{position:fixed;inset:0}
  #log{position:fixed;top:0;left:0;right:0;z-index:99;font:13px/1.45 monospace;white-space:pre-wrap;
       padding:9px 11px;color:#8f8;background:rgba(0,0,0,.72)}
  #log b{color:#ffd27a} .lit{color:#7CFC66} .blk{color:#ff6b6b}
</style>
<div id="c"></div>
<div id="log">horizon3 tracing…
</div>
<script>
  var log = document.getElementById('log');
  function L(m){ log.textContent += m + "\n"; }
  window.onerror = function(m,src,ln){ L('✗ onerror: '+m+' @'+ln); };
  window.addEventListener('unhandledrejection', function(e){ L('✗ rejection: '+(e.reason&&(e.reason.message||e.reason))); });

  var TOKEN='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyNmQyYmQwMC03Nzk3LTQwYjUtODVjNC04Y2U3ZDVjMTNjODAiLCJpZCI6NDU2OTAzLCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODQxNTg5ODR9.ax7uLUdH61cKXQuE1GYSRtYnC2pLQI4YIPXpEev-6Xw';
  var LAT=41.9851, LON=-3.4186, MAX_UTC='2026-08-12T18:28:41Z';
  var R=6371000, RAD=Math.PI/180, STEP=150, MAXRANGE=30000;

  function sunAltAz(ms){
    var n=ms/86400000+2440587.5-2451545.0;
    var Lo=(((280.460+0.9856474*n)%360)+360)%360;
    var g=((((357.528+0.9856003*n)%360)+360)%360)*RAD;
    var lam=(Lo+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD, eps=(23.439-0.0000004*n)*RAD;
    var alpha=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), delta=Math.asin(Math.sin(eps)*Math.sin(lam));
    var gmst=((((280.46061837+360.98564736629*n)%360))+360)%360, ha=(gmst+LON)*RAD-alpha, lat=LAT*RAD;
    var alt=Math.asin(Math.sin(lat)*Math.sin(delta)+Math.cos(lat)*Math.cos(delta)*Math.cos(ha));
    var az=Math.atan2(-Math.sin(ha),Math.tan(delta)*Math.cos(lat)-Math.sin(lat)*Math.cos(ha));
    return { alt:alt/RAD, az:((az/RAD)+360)%360 };
  }
  function dest(la,lo,br,d){ var l1=la*RAD,o1=lo*RAD,b=br*RAD,dR=d/R;
    var l2=Math.asin(Math.sin(l1)*Math.cos(dR)+Math.cos(l1)*Math.sin(dR)*Math.cos(b));
    var o2=o1+Math.atan2(Math.sin(b)*Math.sin(dR)*Math.cos(l1),Math.cos(dR)-Math.sin(l1)*Math.sin(l2));
    return { lat:l2/RAD, lon:o2/RAD }; }
  function nowMs(){ return Cesium.JulianDate.toDate(viewer.clock.currentTime).getTime(); }

  var viewer, profile=null;
  try {
    L('A. token'); Cesium.Ion.defaultAccessToken=TOKEN;
    L('B. viewer…');
    viewer = new Cesium.Viewer('c',{ baseLayerPicker:false, geocoder:false, homeButton:false,
      sceneModePicker:false, navigationHelpButton:false, infoBox:false, selectionIndicator:false,
      timeline:true, animation:true });
    L('C. viewer ✓'); viewer.scene.globe.enableLighting=false;
    var t=Cesium.JulianDate.fromIso8601(MAX_UTC);
    viewer.clock.currentTime=t.clone(); viewer.clock.shouldAnimate=false; viewer.clock.multiplier=120;
    viewer.timeline.zoomTo(Cesium.JulianDate.addMinutes(t,-90,new Cesium.JulianDate()),
                           Cesium.JulianDate.addMinutes(t,90,new Cesium.JulianDate()));
    L('D. terrain…');
    var terr=Cesium.Terrain.fromWorldTerrain();
    terr.errorEvent.addEventListener(function(e){ L('✗ terrain error: '+(e&&(e.message||e))); });
    terr.readyEvent.addEventListener(function(p){ L('E. terrain ready ✓'); run(p); });
    viewer.scene.setTerrain(terr);
    L('D2. waiting for readyEvent…');
  } catch(e){ L('✗ setup threw: '+(e.message||e)); }

  function run(provider){
    try {
      var az=sunAltAz(Date.parse(MAX_UTC)).az;
      var carts=[Cesium.Cartographic.fromDegrees(LON,LAT)], meta=[{d:0,lat:LAT,lon:LON}];
      for(var d=STEP; d<=MAXRANGE; d+=STEP){ var q=dest(LAT,LON,az,d);
        carts.push(Cesium.Cartographic.fromDegrees(q.lon,q.lat)); meta.push({d:d,lat:q.lat,lon:q.lon}); }
      L('F. sampling '+carts.length+' points…');
      Cesium.sampleTerrain(provider,12,carts).then(function(res){
        L('G. sampled ✓'); try{ compute(res,meta,az); L('H. drawn ✓ — see verdict'); }
        catch(e){ L('✗ compute/draw: '+(e.message||e)); }
      }).catch(function(e){ L('✗ sampleTerrain: '+(e.message||e)); });
    } catch(e){ L('✗ run: '+(e.message||e)); }
  }

  function compute(res,meta,az){
    var eyeH=res[0].height+1.7, maxAng=-90, bi=0;
    for(var i=1;i<res.length;i++){ if(res[i].height==null) continue;
      var d=meta[i].d, dz=res[i].height-eyeH-(d*d)/(2*R), a=Math.atan2(dz,d)/RAD;
      if(a>maxAng){ maxAng=a; bi=i; } }
    profile={ az:az, maxAngle:maxAng, eyeH:eyeH,
      blocker:{ d:meta[bi].d, h:res[bi].height, lat:meta[bi].lat, lon:meta[bi].lon } };
    var observer=Cesium.Cartesian3.fromDegrees(LON,LAT,eyeH);
    var track=[]; for(var j=0;j<meta.length;j+=2){ track.push(meta[j].lon,meta[j].lat); }
    viewer.entities.add({ polyline:{ positions:Cesium.Cartesian3.fromDegreesArray(track),
      width:2, clampToGround:true, material:Cesium.Color.YELLOW.withAlpha(0.7) } });
    viewer.entities.add({ position:observer, point:{ pixelSize:11, color:Cesium.Color.CYAN,
      outlineColor:Cesium.Color.BLACK, outlineWidth:2 } });
    viewer.entities.add({ position:Cesium.Cartesian3.fromDegrees(profile.blocker.lon,profile.blocker.lat,profile.blocker.h),
      point:{ pixelSize:10, color:Cesium.Color.ORANGE, outlineColor:Cesium.Color.BLACK, outlineWidth:2 } });
    viewer.entities.add({ polyline:{ width:3,
      positions:new Cesium.CallbackProperty(function(){ var s=sunAltAz(nowMs()), e=dest(LAT,LON,az,MAXRANGE);
        var eh=eyeH+MAXRANGE*Math.tan(s.alt*RAD)-(MAXRANGE*MAXRANGE)/(2*R);
        return [observer, Cesium.Cartesian3.fromDegrees(e.lon,e.lat,eh)]; }, false),
      material:new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(function(){
        var s=sunAltAz(nowMs()); return (s.alt>profile.maxAngle)?Cesium.Color.LIME:Cesium.Color.RED; }, false)) } });
    var cam=dest(LAT,LON,az+180,5500);
    viewer.camera.setView({ destination:Cesium.Cartesian3.fromDegrees(cam.lon,cam.lat,res[0].height+2600),
      orientation:{ heading:az*RAD, pitch:-10*RAD, roll:0 } });
    viewer.clock.onTick.addEventListener(verdict); verdict();
  }

  function verdict(){
    if(!profile) return;
    var s=sunAltAz(nowMs()), margin=s.alt-profile.maxAngle, b=profile.blocker;
    var sightH=profile.eyeH+b.d*Math.tan(s.alt*RAD)-(b.d*b.d)/(2*R), above=b.h-sightH;
    var vtxt,cls;
    if(s.alt<=0){ vtxt='SUN BELOW HORIZON'; cls='blk'; }
    else if(margin>0){ vtxt='SUNLIT ✓  margin +'+margin.toFixed(1)+'°'; cls='lit'; }
    else { vtxt='BLOCKED ✗  by '+(-margin).toFixed(1)+'°'; cls='blk'; }
    log.innerHTML='<b>Horizon check · 2026-08-12 · Spain</b>\n'+
      'sun alt '+s.alt.toFixed(1)+'° az '+s.az.toFixed(1)+'° · ray az '+profile.az.toFixed(1)+'°\n'+
      'skyline ridge '+profile.maxAngle.toFixed(1)+'° at '+(b.d/1000).toFixed(1)+' km · ridge '+(above>0?'+':'')+above.toFixed(0)+' m vs sightline\n'+
      '<span class="'+cls+'" style="font-size:15px">'+vtxt+'</span>\n'+
      'green=clear red=blocked · scrub to move the sun';
  }
</script>
